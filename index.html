 hold together? The chapter suggests that God deliberately reminds us that we are, literally, dust. In the Bible's imagination, dust is **a mirror** that shows us something basic about being human, much more than a poetic way of saying \"you will die\"."]},{"h":"Dust as a symbol of fragility","p":["Dust doesn't stick together like soil or clay. It is what is left when everything else has broken down: the lightest, most temporary stuff there is, blown by the wind, trampled underfoot and scattered.","The Bible often uses dust for human weakness and humility. Job says, \"I am reduced to dust and ashes\" (Job 30:19). Abraham tells God, \"I am but dust and ashes\" (Genesis 18:27). Ecclesiastes says, \"All come from dust, and to dust all return\" (Ecclesiastes 3:20).","To be dust is to be **breakable, small and mortal**. In a world that celebrates strength, success and self-reliance, Scripture tells a hard truth: for all our technology, wealth and power, we are still dust."]},{"h":"The breath in the dust","p":["But that's not the whole story. A chapter before the curse comes a holy moment: \"The Lord God formed the man from the dust (*aphar*) of the ground and breathed into his nostrils the breath of life, and the man became a living being\" (Genesis 2:7).","Dust filled with God's breath comes alive and becomes human. That pairing, dust and divine breath, is the central tension of our existence. We are lowly and limited, yet we carry something divine inside us.","> We are not gods. But we are dust touched by God.","Without God's breath we are nothing. With it, we are capable of life, love, purpose and even eternity."]},{"h":"Dust vs earth","p":["Hebrew draws a subtle but important line between two similar words: **aphar** (dust) and **adamah** (earth or soil). Earth is fertile and full of potential; it is the raw material of creation. Dust is what remains after life has faded.","It's no accident that the name *Adam* comes from *adamah*, linking humans to the life-giving soil. We're made of the stuff that brings forth life. Yet when Adam sins, he is told he will return not to adamah but to **aphar**.","So earth stands for potential, creativity and flourishing, while dust stands for breaking down, loss and death. And yet there is beauty here too: for God, even dust is not the end."]},{"h":"Dust and God's compassion","p":["In Scripture, dust is not only a sign of weakness; it also stirs God's compassion. \"For He knows how we are formed, He remembers that we are dust\" (Psalm 103:14).","God doesn't despise us for being fragile. He remembers it and takes our limits into account. He doesn't demand perfection from dust; he meets it with grace.","Being dust means living within limits, but God doesn't leave us there. The whole story of the Bible, from Eden to the cross to the New Jerusalem, is about **dust being renewed, reclaimed and raised to life**."]},{"h":"Dust and repentance","p":["In ancient Israel, covering yourself with dust or ashes showed grief, humility and repentance. Job repents \"in dust and ashes\". Mordecai sits in ashes when he hears of the king's order to kill the Jews. The dust had no magic power; it was a **symbol** that said, \"I lower myself. I know I need mercy.\"","Jesus used the same symbol when he rebuked cities that would not repent: if his miracles had been done in Tyre and Sidon, \"they would have repented long ago in sackcloth and ashes\" (Matthew 11:21).","Dust and ashes are where people face the truth about their condition, and open themselves to being changed."]},{"h":"Dust as a beginning, not the end","p":["\"To dust you shall return\" is not a final cosmic death sentence. It recognises a cycle: life, death and new life. Jesus described his own death this way: \"Unless a kernel of wheat falls to the ground and dies, it remains alone. But if it dies, it produces many seeds\" (John 12:24).","At death the body returns to dust, but in the Creator's hands dust isn't thrown away. It is reshaped, a seedbed for something new. In 1 Corinthians 15, Paul speaks of the resurrection body raised from what is perishable, yes, from the dust.","Many churches mark Ash Wednesday, the start of Lent (a season of reflection and repentance), by putting ashes on people's foreheads with the words \"Remember that you are dust, and to dust you shall return.\" It is meant to wake us up, not to depress us: to remember our mortality, to live well, to turn back to God, and to remember that even dust is held in his hands.","Being made of dust isn't an insult; it is a sacred paradox. We are humble, mortal and fleeting, yet loved, breathed into by God and destined for renewal. God took dust and made Adam. He took scattered dust and made Israel a people. He takes the dry, dusty places of our lives and breathes new life into them: \"He raises the poor from the dust and lifts the needy from the ash heap\" (Psalm 113:7).","> Dust is not where our story ends. It is where grace begins."]}],"diagrams":[{"type":"wordroot","title":"Anatomy of the word","letters":[{"ch":"ע","name":"Ayin","meaning":"silent / guttural carrier (ah)"},{"ch":"פ","name":"Pe","meaning":"f / p sound"},{"ch":"ר","name":"Resh","meaning":"r sound"}],"root":"ע-פ-ר","rootNote":"dust, loose dry soil","meanings":["dust","what remains after breaking down","frailty","mortality","humility and repentance"]},{"type":"compare","title":"Aphar vs Adamah","after":3,"left":{"label":"Aphar (dust)","items":["Loose, weightless, scattered","What remains after life fades","Breaking down and loss","Where Adam returns after sin"]},"right":{"label":"Adamah (earth)","items":["Fertile and cohesive","Raw material of creation","Potential and flourishing","Source of the name Adam"]}},{"type":"cycle","title":"The story of dust in God's hands","after":6,"center":"Dust","center2":"plus breath","nodes":[{"t":"Formed","d":"God shapes Adam from dust and breathes life into him (Genesis 2:7)."},{"t":"Fragile","d":"Humans are mortal and limited; God remembers we are dust (Psalm 103:14)."},{"t":"Humbled","d":"Sitting in dust and ashes expresses repentance and need for mercy."},{"t":"Returned","d":"At death the body goes back to dust, like a seed in the ground (John 12:24)."},{"t":"Raised","d":"God reforms dust into resurrection life (1 Corinthians 15; Psalm 113:7)."}]}],"verses":[{"ref":"Genesis 3:19","text":"For dust you are, and to dust you shall return."},{"ref":"Genesis 2:7","text":"The Lord God formed the man from the dust of the ground and breathed into his nostrils the breath of life."},{"ref":"Psalm 103:14","text":"For He knows how we are formed, He remembers that we are dust."},{"ref":"John 12:24","text":"Unless a kernel of wheat falls to the ground and dies, it remains alone. But if it dies, it produces many seeds."},{"ref":"Psalm 113:7","text":"He raises the poor from the dust and lifts the needy from the ash heap."}],"keyPoints":["Aphar is loose, fragile dust, a picture of human weakness and mortality.","God's breath turns dust into a living being: we are dust touched by God.","Adam is named after adamah (fertile earth), but after sin he returns to aphar (dust).","God remembers that we are dust and responds to our frailty with compassion, not contempt.","Sitting in dust and ashes was a symbol of humility, grief and repentance.","Dust is not the end: like a seed, it becomes the ground for resurrection and renewal."],"reflect":["How does remembering that you are \"dust\" change the way you think about success, strength or failure?","What \"dry, dusty places\" in your life would you like God to breathe new life into?","Why might God's remembering that we are dust be comforting rather than discouraging?"],"quiz":[{"q":"What makes dust (aphar) different from earth (adamah)?","options":["Dust is fertile; earth is not","Dust is what remains after things break down; earth is fertile","They mean exactly the same","Earth is only used for metal"],"a":1,"why":"Adamah is fertile soil full of potential; aphar is what's left after life fades."},{"q":"What turned dust into a living being in Genesis 2:7?","options":["Water from a river","Fire from heaven","God's breath of life","Sunlight"],"a":2,"why":"God breathed the breath of life into the man formed from dust."},{"q":"According to Psalm 103:14, how does God respond to our being dust?","options":["He forgets us","He demands perfection","He is disappointed","He remembers our frame and shows compassion"],"a":3,"why":"God knows how we are formed and meets our frailty with grace."},{"q":"What did sitting in dust and ashes symbolise in ancient Israel?","options":["Grief, humility and repentance","Victory in battle","Wealth","A wedding celebration"],"a":0,"why":"It was a sign of lowering oneself and seeking mercy, as with Job and Mordecai."}],"terms":[{"term":"Aphar","def":"Hebrew for dust: loose, light soil; a picture of fragility and mortality."},{"term":"Adamah","def":"Hebrew for fertile earth or soil, the source of the name Adam."},{"term":"Sackcloth and ashes","def":"Rough clothing and ashes worn as a sign of mourning and repentance."},{"term":"Ash Wednesday","def":"The first day of Lent, when many Christians receive ashes as a reminder of mortality."},{"term":"Lent","def":"A season of reflection and repentance before Easter."}]}],"glossary":[]};
</script>
<script>
(() => {
const D = window.APP_DATA || { books: [], chapters: [], glossary: [] };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem('hl:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hl:' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s ?? '').replace(/\*+/g, '');
const byId = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const bookOf = id => D.books.find(b => b.id === id);
const chaptersOf = bk => D.chapters.filter(c => c.book === bk);
const ARROW = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';

/* ---------- settings ---------- */
const SCHEMES = [
  ['tekhelet', 'Tekhelet', 255, 78], ['olive', 'Olive', 128, 70], ['pomegranate', 'Pomegranate', 12, 82], ['galilee', 'Galilee', 205, 35],
  ['sand', 'Desert', 55, 25], ['purple', 'Royal', 300, 85], ['cedar', 'Cedar', 160, 50]
];
const root = document.documentElement;
function applySettings() {
  const s = store.get('settings', { scheme: 'tekhelet', mode: 'auto', size: 1, motion: 'on' });
  if (s.scheme === 'tekhelet') delete root.dataset.scheme; else root.dataset.scheme = s.scheme;
  if (s.mode === 'auto') delete root.dataset.theme; else root.dataset.theme = s.mode;
  root.style.setProperty('--fs', s.size);
  root.classList.toggle('calm', s.motion === 'calm');
  $$('#swatches .sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.scheme === s.scheme));
  $$('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === s.mode));
  $$('#sizeSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.size === +s.size));
  $$('#motionSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.motion === s.motion));
  return s;
}
function setSetting(k, v) { const s = store.get('settings', { scheme: 'tekhelet', mode: 'auto', size: 1, motion: 'on' }); s[k] = v; store.set('settings', s); applySettings(); }
$('#swatches').innerHTML = SCHEMES.map(([id, name, h, h2]) =>
  `<button class="sw" data-scheme="${id}" aria-label="${name} colour scheme"><i style="background:oklch(52% .14 ${h});--g:oklch(78% .13 ${h2})"></i><span>${name}</span></button>`).join('');
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) setSetting('scheme', b.dataset.scheme); });
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('mode', b.dataset.mode); });
$('#sizeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('size', +b.dataset.size); });
$('#motionSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('motion', b.dataset.motion); });
const panel = $('#panel'), themeBtn = $('#themeBtn');
themeBtn.addEventListener('click', e => { e.stopPropagation(); panel.hidden = !panel.hidden; themeBtn.setAttribute('aria-expanded', !panel.hidden); });
document.addEventListener('click', e => { if (!panel.hidden && !panel.contains(e.target)) { panel.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } });
applySettings();

/* ---------- progress ---------- */
const done = new Set(store.get('done', []));
const toggleDone = id => { done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); };

/* ---------- toast ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }

/* ---------- diagram renderers ---------- */
const R = {
  flow: d => `<div class="flow">${d.steps.map((s, i) => `<div class="step" style="--i:${i}"><div class="node"><span class="si">STEP ${i + 1}</span><b>${md(s.t)}</b>${s.d ? `<p>${md(s.d)}</p>` : ''}</div><div class="arr">${ARROW}</div></div>`).join('')}</div>`,
  compare: d => `<div class="compare"><div class="chead"><div>${esc(d.left.label)}</div><div></div><div>${esc(d.right.label)}</div></div>${
    d.left.items.map((l, i) => `<div class="crow" style="--i:${i}"><div class="cell cl" data-l="${esc(d.left.label)}">${md(l)}</div><div class="cx">${ARROW}</div><div class="cell cr" data-l="${esc(d.right.label)}">${md(d.right.items[i] ?? '')}</div></div>`).join('')}</div>`,
  timeline: d => `<div class="tl">${d.events.map((e, i) => `<div class="ev" style="--i:${i}">${e.when ? `<div class="when">${esc(e.when)}</div>` : ''}<b>${md(e.t)}</b>${e.d ? `<p>${md(e.d)}</p>` : ''}</div>`).join('')}</div>`,
  cycle: d => {
    const n = d.nodes.length, cx = 150, cy = 150, r = 112;
    const pts = d.nodes.map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
    return `<div class="cycle-wrap"><svg class="cycle-svg" viewBox="0 0 300 300" role="img" aria-label="${esc(d.title)}">
      <circle class="track" cx="150" cy="150" r="112"/><circle class="runner" cx="150" cy="150" r="112" transform="rotate(-90 150 150)"/>
      <text class="center" x="150" y="146">${esc(d.center || '')}</text><text class="center" x="150" y="164">${esc(d.center2 || '')}</text>
      ${pts.map(([x, y], i) => `<g class="cn" data-i="${i}" role="button" tabindex="0" aria-pressed="${i === 0}" aria-label="${esc(plain(d.nodes[i].t))}"><circle cx="${x}" cy="${y}" r="22"/><text x="${x}" y="${y}">${i + 1}</text></g>`).join('')}
    </svg><ol class="cycle-list">${d.nodes.map((nd, i) => `<li data-i="${i}" class="${i === 0 ? 'on' : ''}"><b>${i + 1}. ${md(nd.t)}</b>${nd.d ? md(nd.d) : ''}</li>`).join('')}</ol></div>`;
  },
  tree: d => `<div class="tree"><div class="root">${md(d.root)}</div><div class="stem"></div><div class="branches">${d.branches.map((b, i) => `<div class="br" style="--i:${i}"><b>${md(b.t)}</b>${b.children?.length ? `<ul>${b.children.map(c => `<li>${md(c)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div></div>`,
  layers: d => {
    const L = d.layers; let html = '';
    for (let i = L.length - 1; i >= 0; i--) {
      html = `<div class="layer${i === L.length - 1 ? ' inner-most' : ''}" style="--d:${i}"><div class="lh"><b>${md(L[i].t)}</b>${L[i].d ? `<span>${md(L[i].d)}</span>` : ''}</div>${html}</div>`;
    }
    return `<div class="layers">${html}</div>`;
  },
  wordroot: d => `<div class="wroot"><div class="letters">${(d.letters || []).map((l, i) => `<div class="lt" style="--i:${i}"><span class="he">${esc(l.ch)}</span><b>${esc(l.name)}</b>${l.meaning ? `<span>${esc(l.meaning)}</span>` : ''}</div>`).join('')}</div>
    ${d.root ? `<div class="rootline">ROOT · <span class="he" style="letter-spacing:.3em">${esc(d.root)}</span>${d.rootNote ? ` · ${esc(d.rootNote)}` : ''}</div>` : ''}
    <div class="meanings">${(d.meanings || []).map((m, i) => `<span class="chip ${i % 3 === 0 ? 'accent' : i % 3 === 1 ? 'gold' : ''}" style="--i:${i}">${esc(m)}</span>`).join('')}</div></div>`,
  spectrum: d => `<div class="spec"><div class="bar">${d.points.map((p, i) => `<span class="pt" style="left:${p.pos}%;--i:${i}"></span><span class="pl ${i % 2 ? 'up' : ''}" style="left:${Math.min(88, Math.max(12, p.pos))}%">${md(p.t)}</span>`).join('')}</div><div class="ends"><span>${esc(d.left)}</span><span>${esc(d.right)}</span></div></div>`
};
const TAG = { flow: 'Flowchart', compare: 'Two lenses', timeline: 'Timeline', cycle: 'Cycle', tree: 'Mind map', layers: 'Layers', wordroot: 'Word anatomy', spectrum: 'Spectrum', skeleton: 'Skeleton' };
function diagram(d) {
  if (!R[d.type]) return '';
  const lensBtn = d.type === 'compare' ? `<button class="replay" data-lens>Focus Hebrew lens</button>` : '';

  <div class="dia"><div class="dia-head"><span class="tag">Flowchart</span><h3>${esc(gb?.title || '')}: the argument in ${parts.length} parts</h3></div>
  <div class="map">${parts.map((p, pi) => `${pi ? `<div class="map-arrow"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg></div>` : ''}
    <div class="map-part"><div class="mp-label"><small>${partMeta(gb, p).num === '0' ? 'START' : 'PART ' + esc(partMeta(gb, p).num)}</small><b>${esc(p)}</b></div><div class="map-nodes">${g.filter(c => c.part === p).map((c, k, arr) => `<a href="#c-${c.id}">${esc(c.title)}</a>${k < arr.length - 1 ? '<span class="to">→</span>' : ''}`).join('')}</div></div>`).join('')}</div>
  ${gb?.thesis ? `<p class="dia-note">${md(gb.thesis)}</p>` : ''}</div></div>`;
}

function viewGlossary() {
  setNav('glossary');
  const terms = [...D.glossary.map(t => ({ ...t })), ...D.chapters.flatMap(c => (c.terms || []).map(t => ({ ...t, from: c.id })))];
  const seen = new Map(); terms.forEach(t => { const k = t.term.toLowerCase(); if (!seen.has(k)) seen.set(k, t); });
  const all = [...seen.values()].sort((a, b) => a.term.localeCompare(b.term));
  const letters = [...new Set(all.map(t => t.term[0].toUpperCase()))];
  main.innerHTML = `<div class="view"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Glossary</div><h2>${all.length} key terms, in plain words</h2></div>
    <div class="search" style="width:min(320px,100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr" for="gq">Filter terms</label><input id="gq" type="search" placeholder="Filter terms…"></div></div>
    <div class="gloss-filter">${letters.map(l => `<button class="chip" data-l="${l}">${l}</button>`).join('')}</div>
    <div class="gloss" id="gl"></div></div>`;
  const draw = (f = '') => { const q = f.toLowerCase(); $('#gl').innerHTML = all.filter(t => !q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q)).map(t => `<div class="term"><b>${esc(t.term)}</b><p>${md(t.def)}</p>${t.from && byId[t.from] ? `<a href="#c-${t.from}">From: ${esc(byId[t.from].translit && byId[t.from].hebrew ? byId[t.from].translit : byId[t.from].title)} →</a>` : ''}</div>`).join('') || '<p>No terms match that filter.</p>'; };
  $('#gq').addEventListener('input', e => draw(e.target.value));
  $('.gloss-filter').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; const el = $$('#gl .term b').find(x => x.textContent.toUpperCase().startsWith(b.dataset.l)); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  draw();
}

function viewQuiz() {
  setNav('quiz');
  const pool = D.chapters.flatMap(c => (c.quiz || []).map(q => ({ ...q, src: c.id })));
  const pick = pool.sort(() => Math.random() - .5).slice(0, 10);
  main.innerHTML = `<div class="view" style="max-width:760px"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Mixed quiz</div><h2>Ten questions from across both journeys</h2><p>${pool.length} questions in the pool. Each round draws a new set.</p></div><button class="btn small primary" id="again">New round</button></div>${quizHTML(pick)}</div>`;
  wireQuiz(main); $('#again').onclick = () => viewQuiz();
}

function viewInstall() {
  setNav(null);
  const href = location.href.split('#')[0];
  main.innerHTML = `<div class="view" style="max-width:900px"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Use it everywhere</div><h2>Download &amp; install</h2><p>The whole app is one self-contained file. Open it from the link below on any phone, tablet or computer, or save it and open it offline.</p></div></div>
  <div class="term" style="margin-bottom:14px"><b>Link to this app</b><div class="copy-row"><code id="link">${esc(href)}</code><button class="btn small primary" id="copy">Copy link</button></div></div>
  <div class="install">
   <div class="term"><b>iPhone &amp; iPad</b><ol><li>Open the link in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>.</li></ol></div>
   <div class="term"><b>Android</b><ol><li>Open the link in Chrome.</li><li>Tap the ⋮ menu.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol></div>
   <div class="term"><b>Windows, Mac, Linux</b><ol><li>Open the link in Chrome or Edge.</li><li>Click the install icon in the address bar.</li><li>Or download the single <b>index.html</b> file and double-click it to read offline.</li></ol></div>
  </div></div>`;
  $('#copy').onclick = () => { const t = $('#link').textContent; navigator.clipboard?.writeText(t).then(() => toast('Link copied'), () => { getSelection().selectAllChildren($('#link')); toast('Press Ctrl+C or ⌘C to copy'); }) ?? (getSelection().selectAllChildren($('#link'))); };
}

/* ---------- router ---------- */
let first = true;
function render() {
  keyHandler = null;
  try { window.speechSynthesis?.cancel(); } catch {}
  const h = location.hash.slice(1) || 'home';
  const go = () => {
    if (h.startsWith('c-')) viewChapter(h.slice(2));
    else if (h === 'words') viewWords();
    else if (h === 'map') viewMap();
    else if (h === 'glossary') viewGlossary();
    else if (h === 'quiz') viewQuiz();
    else if (h === 'install') viewInstall();
    else viewHome();
    wireDrawer();
  };
  if (first) { first = false; go(); return; }
  main.innerHTML = skeleton(h.startsWith('c-') ? 'chapter' : 'grid');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  setTimeout(go, 380);
}
function wireDrawer() {
  const toc = $('#toc'); const btn = $('#menuBtn');
  btn.style.visibility = toc ? 'visible' : 'hidden';
  btn.onclick = () => { if (!toc) return; toc.classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.onclick = close; document.body.append(s); };
  function close() { toc?.classList.remove('open'); $('.scrim')?.remove(); }
  toc?.addEventListener('click', e => { if (e.target.closest('a')) close(); });
}
window.addEventListener('hashchange', () => { $('.scrim')?.remove(); render(); });

/* reading progress bar */
addEventListener('scroll', () => { const el = document.documentElement; const p = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight); $('#readProgress').style.width = (location.hash.startsWith('#c-') ? p * 100 : 0) + '%'; }, { passive: true });

/* search */
const idx = D.chapters.map(c => ({ c, text: [c.title, c.subtitle, c.translit, c.hebrew, c.gloss, c.trueMeaning, c.nutshell, ...(c.keyPoints || []), ...c.sections.flatMap(s => [s.h, ...s.p])].map(plain).join(' ') }));
const q = $('#q'), res = $('#results');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase(); if (v.length < 2) { res.hidden = true; return; }
  const hits = idx.filter(x => x.text.toLowerCase().includes(v)).slice(0, 12);
  res.innerHTML = hits.length ? hits.map(({ c, text }) => { const at = text.toLowerCase().indexOf(v); const snip = text.slice(Math.max(0, at - 50), at + 90); return `<a href="#c-${c.id}"><b>${esc(c.hebrew ? c.translit + ' · ' + c.title : c.title)}</b><span>…${esc(snip).replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`)}…</span></a>`; }).join('') : '<div style="padding:12px;color:var(--muted)">No topics match. Try another word.</div>';
  res.hidden = false;
});
res.addEventListener('click', e => { if (e.target.closest('a')) { res.hidden = true; q.value = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });

/* offline install when served over https (GitHub Pages); harmless elsewhere */
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}

render();
})();
</script>

</body>
</html>
