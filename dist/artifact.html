<title>The Hebrew Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive study app: 15 Hebrew words and a Jewish reading of atonement, sacrifice, salvation and redemption.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap">
<style>
/* Layout: a reading room. Top bar + a "scroll" column (≤ 70ch) with an index rail on wide screens;
   hue-driven tokens so every colour scheme gets a matched light and dark palette. */
:root {
  --h: 255;            /* scheme hue (ink + accent) */
  --h2: 78;            /* second hue (lamp gold) */
  --bg: oklch(97.6% 0.007 var(--h));
  --surface: oklch(99.4% 0.004 var(--h));
  --sunk: oklch(94.2% 0.014 var(--h));
  --fg: oklch(25% 0.035 var(--h));
  --muted: oklch(48% 0.03 var(--h));
  --line: oklch(88.5% 0.018 var(--h));
  --accent: oklch(47% 0.15 var(--h));
  --accent-fg: oklch(98.5% 0.01 var(--h));
  --accent-soft: oklch(92.5% 0.045 var(--h));
  --gold: oklch(66% 0.14 var(--h2));
  --gold-soft: oklch(93% 0.05 var(--h2));
  --good: oklch(55% 0.14 150);
  --bad: oklch(55% 0.17 25);
  --shadow: 0 1px 2px oklch(20% 0.03 var(--h) / 0.06), 0 8px 28px oklch(20% 0.05 var(--h) / 0.08);
  --font-ui: "Avenir Next", "AvenirNext-Regular", "Avenir", "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-he: "Frank Ruhl Libre", "SBL Hebrew", "Times New Roman", serif;
  --fs: 1;             /* reader text scale */
  --r: 14px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(17.5% 0.022 var(--h));
    --surface: oklch(21.5% 0.027 var(--h));
    --sunk: oklch(14.5% 0.02 var(--h));
    --fg: oklch(93% 0.014 var(--h));
    --muted: oklch(71% 0.028 var(--h));
    --line: oklch(31% 0.03 var(--h));
    --accent: oklch(74% 0.13 var(--h));
    --accent-fg: oklch(18% 0.03 var(--h));
    --accent-soft: oklch(30% 0.065 var(--h));
    --gold: oklch(81% 0.12 var(--h2));
    --gold-soft: oklch(31% 0.06 var(--h2));
    --good: oklch(74% 0.14 150);
    --bad: oklch(72% 0.15 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 10px 30px oklch(0% 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(17.5% 0.022 var(--h));
  --surface: oklch(21.5% 0.027 var(--h));
  --sunk: oklch(14.5% 0.02 var(--h));
  --fg: oklch(93% 0.014 var(--h));
  --muted: oklch(71% 0.028 var(--h));
  --line: oklch(31% 0.03 var(--h));
  --accent: oklch(74% 0.13 var(--h));
  --accent-fg: oklch(18% 0.03 var(--h));
  --accent-soft: oklch(30% 0.065 var(--h));
  --gold: oklch(81% 0.12 var(--h2));
  --gold-soft: oklch(31% 0.06 var(--h2));
  --good: oklch(74% 0.14 150);
  --bad: oklch(72% 0.15 25);
  --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 10px 30px oklch(0% 0 0 / 0.35);
  color-scheme: dark;
}
/* colour schemes only move hues; the light/dark blocks above do the rest */
:root[data-scheme="olive"]   { --h: 128; --h2: 70; }
:root[data-scheme="pomegranate"] { --h: 12; --h2: 82; }
:root[data-scheme="galilee"] { --h: 205; --h2: 35; }
:root[data-scheme="sand"]    { --h: 55; --h2: 25; }
:root[data-scheme="purple"]  { --h: 300; --h2: 85; }
:root[data-scheme="cedar"]   { --h: 160; --h2: 50; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background-color .4s var(--ease), color .4s var(--ease);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.he { font-family: var(--font-he); direction: rtl; unicode-bidi: isolate; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in oklch, var(--surface) 88%, transparent); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font-weight: 800; letter-spacing: -0.01em; font-size: 17px; flex-shrink: 0; }
.brand-mark { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-family: var(--font-he); font-size: 22px; font-weight: 700; position: relative; }
.brand-mark::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px dashed var(--gold); animation: spin 18s linear infinite; }
.brand small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.top-nav { display: flex; gap: 2px; margin-left: 8px; }
.top-nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 7px 11px; border-radius: 999px; transition: background .2s, color .2s; white-space: nowrap; }
.top-nav a:hover { color: var(--fg); background: var(--sunk); }
.top-nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.spacer { flex: 1; }
.search { position: relative; width: min(280px, 32vw); }
.search input { width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunk); padding: 0 14px 0 36px; outline: none; transition: border-color .2s, box-shadow .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.results { position: absolute; top: 46px; right: 0; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; z-index: 70; }
.results a { display: block; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--fg); }
.results a:hover, .results a:focus { background: var(--sunk); }
.results b { display: block; font-size: 14px; }
.results span { font-size: 13px; color: var(--muted); }
.results mark { background: var(--gold-soft); color: inherit; border-radius: 3px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex-shrink: 0; transition: transform .2s var(--ease), background .2s; }
.icon-btn:hover { background: var(--sunk); transform: rotate(-12deg); }
.icon-btn svg { width: 19px; height: 19px; }
.menu-btn { display: none; }

/* theme panel */
.panel { position: fixed; top: calc(68px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; z-index: 80; display: grid; gap: 16px; animation: pop .28s var(--ease); }
.panel h3 { font-size: 15px; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { border: 2px solid transparent; background: none; padding: 0; border-radius: 12px; display: grid; gap: 4px; justify-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
.sw i { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden; }
.sw i::after { content: ""; position: absolute; right: 0; bottom: 0; width: 45%; height: 45%; border-top-left-radius: 10px; background: var(--g); }
.sw[aria-pressed="true"] { border-color: var(--accent); }
.sw[aria-pressed="true"] span { color: var(--fg); }
.seg { display: flex; background: var(--sunk); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 7px 8px; font-weight: 600; font-size: 13px; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px oklch(0% 0 0 / .12); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }

/* ---------- main ---------- */
main { padding-block: 28px 80px; }
.view { animation: viewIn .5s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
.stagger > * { animation: rise .6s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .06s } .stagger > *:nth-child(3) { animation-delay: .12s }
.stagger > *:nth-child(4) { animation-delay: .18s } .stagger > *:nth-child(5) { animation-delay: .24s }
.stagger > *:nth-child(6) { animation-delay: .3s } .stagger > *:nth-child(n+7) { animation-delay: .36s }

/* skeleton loader */
.skel { display: grid; gap: 14px; max-width: 760px; }
.skel div { border-radius: 10px; background: linear-gradient(90deg, var(--sunk) 0%, var(--line) 40%, var(--sunk) 80%); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
.skel .s-eyebrow { height: 12px; width: 30%; } .skel .s-he { height: 72px; width: 46%; } .skel .s-title { height: 34px; width: 80%; }
.skel .s-card { height: 120px; } .skel .s-line { height: 14px; } .skel .s-line.short { width: 70%; }
.skel .s-diagram { height: 220px; border-radius: 18px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 18px 40px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 62px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lede { font-size: 18px; color: var(--muted); max-width: 52ch; margin-top: 16px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 15px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); transition: transform .2s var(--ease), box-shadow .2s, background .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.small { padding: 7px 14px; font-size: 13px; }
.lens { position: relative; aspect-ratio: 1; max-width: 100%; width: min(440px, 100%); justify-self: center; }
.lens svg { width: 100%; height: 100%; overflow: visible; }
.lens .ring { fill: none; stroke: var(--line); stroke-width: 1.2; }
.lens .ring.dash { stroke: var(--gold); stroke-dasharray: 3 9; transform-origin: 220px 220px; animation: spin 50s linear infinite; }
.lens .orbit-letter { font-family: var(--font-he); fill: var(--muted); font-size: 20px; text-anchor: middle; dominant-baseline: central; }
.lens-core { position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--surface) 70%); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-content: center; text-align: center; gap: 6px; padding: 10px; }
.lens-core .he { font-size: clamp(44px, 9vw, 76px); font-weight: 700; color: var(--accent); line-height: 1; transition: opacity .4s, transform .4s var(--ease); }
.lens-core .tr { font-weight: 800; letter-spacing: .18em; font-size: 13px; text-transform: uppercase; }
.lens-core .from { font-size: 13px; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
.lens-core .to { font-size: 14px; font-weight: 700; color: var(--fg); max-width: 22ch; margin: 0 auto; }
.lens-core.swap .he, .lens-core.swap .tr, .lens-core.swap .from, .lens-core.swap .to { opacity: 0; transform: translateY(6px); }
.lens-core > * { transition: opacity .4s, transform .4s var(--ease); }

.progress-card { display: flex; align-items: center; gap: 18px; padding: 18px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
.ring-prog { width: 64px; height: 64px; flex-shrink: 0; }
.ring-prog circle { fill: none; stroke-width: 7; }
.ring-prog .bg { stroke: var(--sunk); } .ring-prog .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring-prog text { font-size: 15px; font-weight: 800; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-block: 44px 18px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -0.02em; }
.section-head p { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.wcard { position: relative; display: grid; gap: 6px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); overflow: hidden; transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; min-width: 0; }
.wcard:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
.wcard .num { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.wcard .he { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1.1; text-align: right; }
.wcard b { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.wcard span.sub { font-size: 13px; color: var(--muted); }
.wcard .done-tick { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 900; }
.wcard .he-bg { position: absolute; left: -10px; bottom: -28px; font-family: var(--font-he); font-size: 120px; color: var(--sunk); z-index: 0; line-height: 1; pointer-events: none; transition: transform .5s var(--ease); }
.wcard:hover .he-bg { transform: translateY(-8px) rotate(-6deg); }
.wcard > *:not(.he-bg) { position: relative; z-index: 1; }

.parts { display: grid; gap: 14px; }
.part { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.part > button { width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 0; background: none; text-align: left; }
.part .pnum { width: 46px; height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex-shrink: 0; }
.part .ptitle { flex: 1; min-width: 0; }
.part .ptitle b { display: block; font-size: 18px; }
.part .ptitle span { font-size: 13px; color: var(--muted); }
.part .chev { transition: transform .3s var(--ease); color: var(--muted); }
.part[data-open="true"] .chev { transform: rotate(180deg); }
.part ol { list-style: none; margin: 0; padding: 0 12px 14px; display: grid; gap: 4px; }
.part li a { display: flex; gap: 14px; align-items: baseline; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--fg); transition: background .2s; }
.part li a:hover { background: var(--sunk); }
.part li .cn { font-size: 12px; font-weight: 800; color: var(--muted); width: 26px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.part li .ct { flex: 1; min-width: 0; }
.part li .ct small { display: block; color: var(--muted); font-size: 13px; }
.part li .ok { color: var(--good); font-weight: 900; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tool { display: grid; gap: 8px; padding: 18px; border-radius: 18px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); transition: transform .25s var(--ease), box-shadow .25s; }
.tool:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.tool .ti { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); }
.tool .ti svg { width: 22px; height: 22px; }
.tool b { font-size: 16px; }
.tool span { font-size: 14px; color: var(--muted); }

/* ---------- reader ---------- */
.reader { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 100px); overflow: auto; padding-right: 6px; font-size: 14px; overscroll-behavior: contain; }
.toc h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px 10px; }
.toc a { display: flex; gap: 10px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--fg); line-height: 1.3; }
.toc a:hover { background: var(--sunk); }
.toc a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.toc a .n { color: var(--muted); font-size: 12px; font-weight: 700; width: 20px; flex-shrink: 0; padding-top: 1px; font-variant-numeric: tabular-nums; }
.toc a .d { margin-left: auto; color: var(--good); font-weight: 900; }
.toc-book { display: flex; gap: 6px; margin-bottom: 6px; }
.toc-book button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px; font-size: 13px; font-weight: 700; color: var(--muted); }
.toc-book button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.article { max-width: 760px; min-width: 0; font-size: calc(17px * var(--fs)); }
.chapter-head { display: grid; gap: 12px; padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.chapter-head .he-big { font-size: clamp(64px, 12vw, 120px); font-weight: 700; color: var(--accent); line-height: 1; text-align: right; }
.he-big span { display: inline-block; animation: letterIn .7s var(--ease) both; }
@keyframes letterIn { from { opacity: 0; transform: translateY(-30px) rotate(-8deg); } }
.chapter-head h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; letter-spacing: -0.025em; }
.chapter-head .subtitle { font-size: 1.1em; color: var(--muted); }
.translit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; background: var(--sunk); color: var(--fg); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.gold { background: var(--gold-soft); color: var(--fg); }
.chip.strike { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; color: var(--muted); }
.meaning-shift { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; margin-top: 6px; }
.meaning-shift > div { border-radius: 14px; padding: 14px 16px; background: var(--sunk); min-width: 0; }
.meaning-shift > div:last-child { background: var(--accent-soft); }
.meaning-shift small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.meaning-shift .arrow { display: grid; place-items: center; color: var(--gold); background: none; padding: 0; }
.meaning-shift .arrow svg { width: 28px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(5px); } }
.tools-row { display: flex; flex-wrap: wrap; gap: 8px; }
.nutshell { position: relative; border-radius: 18px; padding: 20px 22px 20px 22px; background: linear-gradient(135deg, var(--gold-soft), var(--surface) 70%); border: 1px solid var(--line); margin-bottom: 30px; }
.nutshell .eyebrow { color: var(--fg); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.nutshell p { font-size: 1.06em; font-weight: 600; line-height: 1.55; }
.block { margin-block: 34px; }
.block > h2 { font-size: 1.45em; font-weight: 800; margin-bottom: 14px; letter-spacing: -0.015em; display: flex; gap: 12px; align-items: baseline; }
.block > h2 .sn { font-size: 13px; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.prose { display: grid; gap: 14px; line-height: 1.72; max-width: 68ch; }
.prose strong { color: var(--fg); font-weight: 700; background: linear-gradient(transparent 62%, var(--gold-soft) 62%); }
.prose em { font-style: italic; }
.callout { border-left: 3px solid var(--gold); padding: 4px 0 4px 16px; color: var(--fg); font-weight: 600; }
.verse { border-radius: 14px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.verse q { font-style: italic; quotes: "\201C" "\201D"; }
.verse cite { font-style: normal; font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .04em; }
.verses { display: grid; gap: 10px; }
.keypoints { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: kp; }
.keypoints li { counter-increment: kp; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.keypoints li::before { content: counter(kp); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.reflect { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.reflect li { padding: 12px 16px; border-radius: 12px; background: var(--sunk); }
.done-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); margin-top: 40px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.pager a { display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); text-decoration: none; color: var(--fg); background: var(--surface); min-width: 0; transition: border-color .2s, transform .2s var(--ease); }
.pager a:hover { border-color: var(--accent); transform: translateY(-2px); }
.pager a small { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.pager a.next { text-align: right; grid-column: 2; }
.read-progress { position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 3px; background: var(--gold); z-index: 90; width: 0; transition: width .1s linear; }

/* ---------- diagrams ---------- */
.dia { border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 20px; overflow: hidden; position: relative; }
.dia-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.dia-head .tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 4px 10px; }
.dia-head h3 { font-size: 1.05em; font-weight: 800; flex: 1; min-width: 12ch; }
.dia-scroll { overflow-x: auto; }
.dia-note { font-size: 14px; color: var(--muted); margin-top: 14px; }
.replay { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
/* flow */
.flow { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; }
.flow .step { flex: 1 1 170px; display: grid; grid-template-columns: minmax(0, 1fr) 34px; align-items: center; min-width: 0; }
.flow .node { border-radius: 14px; padding: 14px; background: var(--sunk); border: 1px solid var(--line); height: 100%; min-width: 0; font-size: 15px; transition: background .25s, transform .25s var(--ease); }
.flow .node:hover { transform: translateY(-3px); background: var(--accent-soft); }
.flow .node b { display: block; margin-bottom: 4px; font-size: 15px; }
.flow .node .si { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .1em; }
.flow .node p { font-size: 14px; color: var(--muted); line-height: 1.45; }
.flow .arr { color: var(--gold); display: grid; place-items: center; }
.flow .step:last-child { grid-template-columns: minmax(0, 1fr); }
.flow .step:last-child .arr { display: none; }
.flow .step:last-child .node { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.flow .step:last-child .node p, .flow .step:last-child .node .si { color: var(--accent-fg); opacity: .88; }
.play .flow .step { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i) * .16s); }
/* compare */
.compare { display: grid; gap: 8px; }
.compare .chead, .compare .crow { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.compare .chead div { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; }
.compare .chead div:first-child { color: var(--muted); } .compare .chead div:last-child { color: var(--accent); }
.compare .cell { border-radius: 12px; padding: 12px 14px; font-size: 15px; min-width: 0; line-height: 1.45; }
.compare .cl { background: var(--sunk); color: var(--muted); }
.compare .cr { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.compare .cx { display: grid; place-items: center; color: var(--gold); }
.play .compare .crow { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .12s); }
.play .compare .cr { animation: glow 1.2s var(--ease) both; animation-delay: calc(var(--i) * .12s + .3s); }
@keyframes glow { from { box-shadow: 0 0 0 0 var(--accent); } 40% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.lens-toggle .compare .cl { filter: blur(2px); opacity: .5; }
/* timeline */
.tl { position: relative; display: grid; gap: 14px; padding-left: 30px; }
.tl::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--gold)); border-radius: 2px; transform-origin: top; }
.play .tl::before { animation: grow 1.2s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } }
.tl .ev { position: relative; }
.tl .ev::before { content: ""; position: absolute; left: -27px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.tl .when { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.tl b { display: block; font-size: 15px; }
.tl p { font-size: 14px; color: var(--muted); }
.play .tl .ev { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .14s + .2s); }
/* cycle */
.cycle-wrap { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 20px; align-items: center; }
.cycle-svg { width: 100%; max-width: 300px; aspect-ratio: 1; justify-self: center; }
.cycle-svg .track { fill: none; stroke: var(--line); stroke-width: 2; }
.cycle-svg .runner { fill: none; stroke: var(--gold); stroke-width: 3; stroke-dasharray: 40 900; stroke-linecap: round; animation: run 6s linear infinite; }
@keyframes run { to { stroke-dashoffset: -940; } }
.cycle-svg .cn { cursor: pointer; }
.cycle-svg .cn circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; transition: fill .25s; }
.cycle-svg .cn text { fill: var(--accent); font-weight: 800; font-size: 15px; text-anchor: middle; dominant-baseline: central; font-family: var(--font-ui); }
.cycle-svg .cn[aria-pressed="true"] circle { fill: var(--accent); }
.cycle-svg .cn[aria-pressed="true"] text { fill: var(--accent-fg); }
.cycle-svg .center { fill: var(--muted); font-size: 13px; font-weight: 700; text-anchor: middle; font-family: var(--font-ui); }
.cycle-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.cycle-list li { padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 14px; color: var(--muted); transition: background .25s, color .25s, transform .25s var(--ease); cursor: pointer; }
.cycle-list li b { color: var(--fg); display: block; font-size: 15px; }
.cycle-list li.on { background: var(--accent-soft); color: var(--fg); transform: translateX(4px); }
/* tree */
.tree { display: grid; gap: 0; justify-items: center; }
.tree .root { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 10px 22px; font-weight: 800; text-align: center; max-width: 100%; }
.tree .stem { width: 2px; height: 22px; background: var(--line); }
.tree .branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; width: 100%; border-top: 2px solid var(--line); padding-top: 16px; }
.tree .br { border-radius: 14px; padding: 12px 14px; background: var(--sunk); min-width: 0; position: relative; }
.tree .br::before { content: ""; position: absolute; top: -18px; left: 50%; width: 2px; height: 16px; background: var(--line); }
.tree .br b { display: block; font-size: 15px; margin-bottom: 6px; color: var(--accent); }
.tree .br ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: grid; gap: 3px; }
.play .tree .br { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .1s + .15s); }
/* layers */
.layers { display: grid; place-items: center; padding: 6px; }
.layer { width: 100%; border-radius: 18px; padding: 14px 14px 14px; border: 1.5px solid var(--line); display: grid; gap: 10px; cursor: pointer; transition: border-color .25s, box-shadow .25s; background: color-mix(in oklch, var(--accent-soft) calc(var(--d) * 22%), var(--surface)); }
.layer > .lh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.layer > .lh b { font-size: 15px; }
.layer > .lh span { font-size: 13px; color: var(--muted); }
.layer:hover { border-color: var(--accent); }
.layer.inner-most { background: var(--accent); color: var(--accent-fg); text-align: center; }
.layer.inner-most > .lh span { color: var(--accent-fg); opacity: .85; }
.layer.inner-most > .lh { justify-content: center; }
.play .layer { animation: zoomIn .6s var(--ease) both; animation-delay: calc(var(--d) * .14s); }
@keyframes zoomIn { from { opacity: 0; transform: scale(.94); } }
/* word root (anatomy) */
.wroot { display: grid; gap: 18px; justify-items: center; text-align: center; }
.wroot .letters { display: flex; gap: 10px; direction: rtl; flex-wrap: wrap; justify-content: center; }
.wroot .lt { display: grid; gap: 4px; justify-items: center; width: 92px; padding: 12px 6px; border-radius: 16px; background: var(--sunk); border: 1px solid var(--line); direction: ltr; }
.wroot .lt .he { font-size: 46px; font-weight: 700; color: var(--accent); line-height: 1.05; }
.wroot .lt b { font-size: 13px; }
.wroot .lt span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.play .wroot .lt { animation: letterIn .7s var(--ease) both; animation-delay: calc(var(--i) * .18s); }
.wroot .rootline { font-weight: 800; letter-spacing: .2em; color: var(--muted); font-size: 13px; }
.wroot .meanings { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.play .wroot .meanings .chip { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .08s + .7s); }
/* spectrum */
.spec { padding: 30px 6px 10px; }
.spec .bar { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--sunk), var(--accent)); }
.spec .pt { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--gold); }
.spec .pl { position: absolute; top: 18px; transform: translateX(-50%); font-size: 13px; font-weight: 700; width: 130px; text-align: center; line-height: 1.3; }
.spec .pl.up { top: auto; bottom: 18px; }
.spec .ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 64px; gap: 12px; }
.play .spec .pt { animation: slideIn 1s var(--ease) both; animation-delay: calc(var(--i) * .15s); }
@keyframes slideIn { from { left: 0 !important; opacity: 0; } }
/* skeleton (fishbone of the argument) */
.bones { position: relative; display: grid; gap: 10px; padding: 6px 0; }
.bones::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 40px; width: 4px; margin-left: -2px; border-radius: 4px; background: repeating-linear-gradient(var(--accent) 0 14px, transparent 14px 20px); }
.play .bones::before { animation: grow 1.4s var(--ease) both; transform-origin: top; }
.bone { display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr); align-items: center; }
.bone .rib { padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 14px; font-weight: 600; min-width: 0; position: relative; }
.bone .rib small { display: block; font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: .1em; }
.bone .joint { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); justify-self: center; position: relative; z-index: 1; }
.bone.l .rib { grid-column: 1; text-align: right; } .bone.l .joint { grid-column: 2; grid-row: 1; }
.bone.r .joint { grid-column: 2; grid-row: 1; } .bone.r .rib { grid-column: 3; grid-row: 1; }
.play .bone { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * .1s + .2s); }
.bone-head { justify-self: center; text-align: center; max-width: 46ch; padding: 14px 20px; border-radius: 18px; background: var(--accent); color: var(--accent-fg); font-weight: 700; position: relative; z-index: 1; }
.bone-head small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }

/* quiz */
.quiz { display: grid; gap: 14px; }
.q { border-radius: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; }
.q b { font-size: 1em; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 14px; font-size: 15px; transition: border-color .2s, background .2s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateX(3px); }
.opt.right { border-color: var(--good); background: color-mix(in oklch, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in oklch, var(--bad) 12%, var(--surface)); animation: shake .4s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.why { font-size: 14px; color: var(--muted); padding: 10px 14px; border-radius: 10px; background: var(--sunk); }
.score { font-weight: 800; font-size: 18px; }

/* flashcards */
.fc-stage { display: grid; justify-items: center; gap: 18px; perspective: 1400px; }
.fc { width: min(520px, 100%); aspect-ratio: 4 / 3; max-width: 100%; position: relative; transform-style: preserve-3d; transition: transform .7s var(--ease); cursor: pointer; border: 0; background: none; padding: 0; }
.fc.flipped { transform: rotateY(180deg); }
.fc .face { position: absolute; inset: 0; border-radius: 24px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-content: center; gap: 10px; text-align: center; padding: 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.fc .front .he { font-size: clamp(64px, 14vw, 110px); font-weight: 700; color: var(--accent); line-height: 1; }
.fc .front b { letter-spacing: .2em; text-transform: uppercase; }
.fc .front small, .fc .back small { color: var(--muted); font-size: 13px; }
.fc .back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--accent-soft), var(--surface)); }
.fc .back h3 { font-size: clamp(20px, 3vw, 26px); }
.fc .back p { font-size: 15px; max-width: 40ch; margin: 0 auto; }
.fc-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.fc-dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.fc-dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; background: var(--line); padding: 0; }
.fc-dots button[aria-current="true"] { background: var(--accent); transform: scale(1.3); }

/* glossary */
.gloss-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.term { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; min-width: 0; }
.term b { font-size: 16px; }
.term p { font-size: 14px; color: var(--muted); }
.term a { font-size: 13px; font-weight: 700; text-decoration: none; }

/* big picture map */
.map { display: grid; gap: 18px; }
.map-part { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; align-items: start; position: relative; }
.map-part .mp-label { position: sticky; top: 90px; border-radius: 16px; padding: 16px; background: var(--accent); color: var(--accent-fg); }
.map-part .mp-label small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; opacity: .8; }
.map-part .mp-label b { font-size: 16px; line-height: 1.25; display: block; }
.map-nodes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.map-nodes a { padding: 9px 13px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--fg); font-size: 14px; font-weight: 600; transition: transform .2s var(--ease), border-color .2s; max-width: 100%; }
.map-nodes a:hover { transform: translateY(-2px); border-color: var(--accent); }
.map-nodes .to { color: var(--gold); font-weight: 900; }
.map-arrow { justify-self: center; color: var(--gold); }
.map-arrow svg { animation: float 2s ease-in-out infinite; }
.constellation { position: relative; width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 1.5; }
.constellation svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.constellation svg line { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 5; }
.constellation a { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; text-decoration: none; color: var(--fg); gap: 2px; transition: transform .25s var(--ease); }
.constellation a:hover { transform: translate(-50%, -50%) scale(1.12); }
.constellation a .he { font-size: clamp(18px, 3.4vw, 30px); font-weight: 700; color: var(--accent); background: var(--surface); border: 1.5px solid var(--line); border-radius: 50%; width: clamp(42px, 7vw, 64px); aspect-ratio: 1; display: grid; place-items: center; box-shadow: var(--shadow); }
.constellation a span { font-size: clamp(9px, 1.5vw, 12px); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.constellation a { animation: twinkle 4s ease-in-out infinite; animation-delay: calc(var(--i) * .3s); }
@keyframes twinkle { 50% { transform: translate(-50%, calc(-50% - 4px)); } }

.install { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.install .term ol { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row code { font-size: 13px; background: var(--sunk); padding: 8px 10px; border-radius: 8px; word-break: break-all; flex: 1; min-width: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 100; animation: pop .3s var(--ease); }
footer { border-top: 1px solid var(--line); padding-block: 26px; color: var(--muted); font-size: 13px; }

/* mobile */
@media (max-width: 960px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .toc { position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); max-height: none; background: var(--surface); z-index: 85; padding: calc(16px + env(safe-area-inset-top, 0px)) 14px 24px max(14px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .35s var(--ease); box-shadow: var(--shadow); }
  .toc.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: oklch(0% 0 0 / .35); z-index: 84; animation: viewIn .3s both; }
  .menu-btn { display: grid; }
  .top-nav { display: none; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .lens { width: min(340px, 100%); order: -1; }
  .map-part { grid-template-columns: minmax(0, 1fr); }
  .map-part .mp-label { position: static; }
  .cycle-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .search { width: auto; flex: 1; min-width: 0; }
  .brand > span { display: none; }
  .meaning-shift { grid-template-columns: minmax(0, 1fr); }
  .meaning-shift .arrow svg { transform: rotate(90deg); animation: none; }
  .compare .chead, .compare .crow { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .compare .cx { transform: rotate(90deg); height: 20px; }
  .compare .chead { display: none; }
  .compare .cl::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
  .compare .cr::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .compare .crow { padding-bottom: 8px; }
  .bones::before { left: 12px; }

<script>
window.APP_DATA = {"books":[{"id":"words","short":"15 Words","title":"Lost in Translation","headline":"15 Hebrew words that change how you read","blurb":"Each word carries far more than its usual English translation. Recover the fuller meaning, one word at a time."},{"id":"gospel","short":"The Gospel","title":"The Gospel Before Christianity","headline":"Atonement, sacrifice and redemption through Jewish eyes","blurb":"One long argument in six parts: read the good news as Jesus' first Jewish followers would have heard it.","thesis":"The flow runs from **context** (how first-century Jews thought), to **the meaning of blood, sacrifice and atonement**, to **why Jesus died**, to **what salvation really is**, to **what judgment and \"hell\" are for**, and finally to **how we should live now**.","parts":[{"num":"0","blurb":"Glossary, preface and the roadmap"},{"num":"I","blurb":"Time, truth, Eden and the earliest church"},{"num":"II","blurb":"What blood, offerings and atonement meant"},{"num":"III","blurb":"Five reasons Jesus died"},{"num":"IV","blurb":"Salvation in the Hebrew Bible and beyond"},{"num":"V","blurb":"The history and purpose of judgment"},{"num":"VI","blurb":"Reward, greatness and living the kingdom"}]}],"chapters":[{"id":"w-intro","book":"words","order":0,"num":null,"title":"Why Hebrew Still Matters","subtitle":"Every translation is a bridge, and every bridge charges a toll.","nutshell":"The Hebrew Scriptures were first spoken in a language that packs many meanings into a few words, uses roots like DNA and loves wordplay. Translations carry the message around the world, but every translation is also an interpretation, and the translator's choices can quietly reshape how readers picture God. This opening invites readers to slow down and hear the original voice behind fifteen key Hebrew words.","bigIdea":"Translation always involves interpretation, so recovering the Hebrew behind key Bible words can change how we understand God and ourselves.","skeleton":["The Hebrew Bible is the shared root of Judaism and Christianity","Hebrew is a worldview, not just a vocabulary","One Hebrew word often holds several English ideas at once","Translators must pick one shade, so meaning gets lost","Small translation choices can carry big theological assumptions","Awareness, humility and curiosity help bridge the gap","Fifteen words become doorways back to the original voice"],"sections":[{"h":"More than an ancient text","p":["The Hebrew Scriptures, called the **Tanakh** by Jews and the **Old Testament** by Christians, are the backbone of both faiths. They shape what people believe about God, how they live and how they imagine the divine.","But what happens when these writings pass into another language and another way of seeing the world? The message can still speak clearly. Yet something can slip through the cracks. Think of a famous painting copied in a different style: the outline survives, but the texture and intention may change."]},{"h":"Hebrew is a worldview","p":["Reading Scripture in Hebrew is not just swapping one dictionary for another. Hebrew was the mother tongue of the prophets, poets, psalm-writers and priests. It was shaped by covenant, exile, wonder and hope, so it carries the soul of a people.","Each Hebrew word is like a window with many panes: language, history, poetry and theology. *Shalom* is not only “peace” but wholeness, balance and flourishing. *Chesed* is not only “mercy” but loyal covenant love, stubborn kindness and undeserved grace.","> English tends to split these ideas into separate words; Hebrew braids them together like threads in one tapestry. The original does not shrink meaning, it multiplies it."]},{"h":"Sacred wordplay","p":["Hebrew poetry and storytelling are full of wordplay, especially in Psalms, Proverbs and Genesis. When Adam calls his partner *ishshah* (woman) because she came from *ish* (man), the naming points to unity, shared origin and belonging. In Hebrew, a pun can carry a spiritual truth.","Even God's name, **YHWH**, comes from the verb “to be.” It hints at Being itself, eternal and faithful presence. So when a Jew prays the **Shema** (Deuteronomy 6:4), “Hear, O Israel, the LORD is our God, the LORD is one,” it is more than a statement that there is one God. It proclaims a God who was, who is and who will be."]},{"h":"Every translation is an interpretation","p":["Most Bible readers do not know Hebrew, and that is fine. Translations have carried the Bible to the ends of the earth. But reading only in translation is like hearing a symphony through a wall: you catch the tune and miss the depth and emotion behind each note.","Translations are bridges across time and language, but every bridge has a toll. The price is lost poetry, lost cultural echoes and lost depth. Every translated verse also carries some fingerprints of the translator's beliefs and unconscious bias. Imagine reading poetry in a language with no rhyme, or watching a play where every actor wears a mask: you get the plot, but not the soul."]},{"h":"Small vocabulary, deep meaning","p":["Biblical Hebrew is like a compressed diamond. It has only around **8,000 root words**, yet it says a great deal with them. Each word glows with several meanings that shift with context and feeling.","English prefers precision, so translators are forced to pick one colour from a rainbow. Is this word about mercy or covenant? Justice or anger? Crossing a river or crossing a line? Whatever they choose, something is lost. Not always wrongly, but always."]},{"h":"The Spirit and grammatical gender","p":["Genesis 1:2 says the Spirit of God was “hovering over the waters.” The Hebrew word for Spirit, *ruach*, is grammatically feminine. That does not make the Spirit a woman, because **grammatical gender** (a word's grammar category) is not the same as personal identity.","In Greek the word *pneuma* is neuter, with no gender at all. In English, tradition, not grammar, leads us to say “He.” As a verse travels from Hebrew to Greek to Latin to English, assumptions pile up. This matters, because it shapes how people picture God and pray, and the original image is of a Spirit brooding over chaos like a mother bird over her nest."]},{"h":"Roots: the hidden architecture of words","p":["English builds words with prefixes and suffixes. Hebrew starts from **roots**: usually three consonants that act like DNA, from which whole families of words grow.","Take the root **A-V-R** (ayin-vav-resh), the root of *Ivrit*, “Hebrew.” *Avar* means to pass over or through. *Ivri* means a Hebrew person, literally “one who crossed over.” *Ma'avar* is a crossing or passage. *Averah* is a transgression, crossing a moral line. In another form it can even mean wrath or judgment.","All these meanings circle one theme: movement, boundaries and transition. Hebrew links physical, historical and moral ideas through one thread. When a translator pulls a word out of its root and gives it a single fixed English meaning, those links disappear."]},{"h":"When vocabulary becomes theology","p":["The Hebrew Bible is full of idioms, puns on place names, echoes between verses and farming images that modern readers no longer feel. Without the original, we miss the joke, the poetry, the heartbreak and the irony.","The bigger danger is misunderstanding God himself. Translators must decide: does God allow evil or cause it? Is a command conditional or permanent? Is grace limited or abundant? Repeated across generations of Bibles and sermons, these choices harden into whole belief systems. In the United States most translations come from Protestant scholars, and their theology can be seen in certain renderings.","Example: Matthew 10:29. The 1611 King James Version says no sparrow falls to the ground “without your Father”, meaning God is aware. The New King James Version says “apart from your Father's **will**.” The word “will” is not in the Greek. It was likely added under Calvinist influence (the tradition of John Calvin, which stresses that God decrees all events). One word moves the reader from a God who **witnesses** suffering to a God who **ordains** it.","> This is not a question of grammar. It is a question of who we believe God is."]},{"h":"Listening more carefully","p":["The original languages, Hebrew, Aramaic and Greek, are rich in ambiguity, symbol and poetry, and they invite reflection. Modern translations often prefer neat certainty and **systematic theology** (doctrine arranged into a tidy logical system). They can end up resolving tensions the Bible left open, flattening parables into doctrines and even slipping human-made teaching into the text. This is not an attack on translators but a call to humility and careful study.","You do not need to be a scholar. Curiosity, reverence and a willingness to slow down are enough to start. Comparing several translations side by side helps, and so does asking someone who actually speaks Hebrew fluently, not just someone who took one seminary class. The aim is not to become a language purist but to hear what was really said.","This book is not a dictionary or textbook but a “spiritual excavation.” Its fifteen Hebrew words are doorways that can change how we think, pray, forgive, suffer and love. The Hebrew Bible is not only about God; it is about what it means to be human in relationship with God."]}],"diagrams":[{"type":"compare","title":"Reading in translation vs. hearing the original","after":3,"left":{"label":"Translation alone","items":["One fixed English word per Hebrew word","Shalom = “peace”","Spirit called “He” by tradition","Puns and echoes vanish","Translator's theology quietly built in","Tensions resolved into neat doctrine"]},"right":{"label":"The Hebrew original","items":["One root feeds a whole family of meanings","Shalom = wholeness, welfare, harmony, completion","Ruach is grammatically feminine, brooding like a mother bird","Wordplay like ish / ishshah carries meaning","Text can be weighed against multiple renderings","Mystery and tension left open for reflection"]}},{"type":"flow","title":"How a translation choice becomes a belief","after":7,"steps":[{"t":"Rich original","d":"A Hebrew or Greek word holds several possible shades of meaning."},{"t":"Translator chooses","d":"English forces one shade, shaped by the translator's own theology."},{"t":"Repeated in Bibles","d":"The choice is copied into edition after edition."},{"t":"Preached and taught","d":"Sermons and doctrines build on the chosen wording."},{"t":"Shapes our picture of God","d":"Readers absorb the theology without realizing a choice was made."}]},{"type":"tree","title":"One root, many meanings: A-V-R","after":6,"root":"A-V-R: to cross over","branches":[{"t":"Avar","children":["to pass over","to go through"]},{"t":"Ivri","children":["a Hebrew person","one who crossed over"]},{"t":"Ma'avar","children":["a crossing","a passage"]},{"t":"Averah","children":["transgression","crossing a moral line"]},{"t":"Another form","children":["wrath","judgment"]}]}],"verses":[{"ref":"Genesis 1:2","text":"The Spirit of God was hovering over the face of the waters."},{"ref":"Genesis 2:23","text":"She shall be called Woman (ishshah), because she was taken out of Man (ish)."},{"ref":"Deuteronomy 6:4","text":"Hear, O Israel: the LORD is our God, the LORD is one."},{"ref":"Matthew 10:29","text":"Are not two sparrows sold for a penny? Yet not one of them falls to the ground without your Father."}],"keyPoints":["Hebrew is a worldview as well as a language, and its words often bundle several ideas together.","Biblical Hebrew has a small vocabulary of about 8,000 roots, so each word carries a lot of meaning.","Hebrew builds word families from three-letter roots, which link physical, moral and historical ideas.","Every translation is an interpretation shaped by the translator's beliefs.","A single added word, such as “will” in Matthew 10:29, can change how readers picture God.","You don't need to be a scholar: comparing translations and asking fluent Hebrew speakers can open up meaning."],"reflect":["Which Bible words have you always taken at face value that might hold more meaning than you thought?","How might your picture of God change if a familiar verse were translated differently?","What would it look like for you to read Scripture more slowly and carefully?"],"quiz":[{"q":"About how many root words does Biblical Hebrew have?","options":["800","8,000","80,000","800,000"],"a":1,"why":"The chapter describes Hebrew as small in vocabulary, around 8,000 roots, but vast in depth."},{"q":"What is the grammatical gender of the Hebrew word ruach (Spirit)?","options":["Masculine","Neuter","Feminine","It has no grammar category"],"a":2,"why":"Ruach is grammatically feminine; the Greek pneuma is neuter, and English “He” comes from tradition."},{"q":"What word did the NKJV add in Matthew 10:29 that is not in the Greek?","options":["Will","Know","Love","See"],"a":0,"why":"Adding “will” shifts the meaning from God being aware of suffering to God ordaining it."},{"q":"The root A-V-R mainly carries which theme?","options":["Light and darkness","Crossing over and boundaries","Eating and drinking","Kingship and rule"],"a":1,"why":"Avar, Ivri, ma'avar and averah all relate to passing over or crossing a line."}],"terms":[{"term":"Tanakh","def":"The Jewish name for the Hebrew Scriptures, which Christians call the Old Testament."},{"term":"Root","def":"A core set of (usually three) Hebrew consonants from which a family of related words is built."},{"term":"Ruach","def":"Hebrew for spirit, breath or wind; grammatically feminine."},{"term":"Shema","def":"The central Jewish prayer from Deuteronomy 6:4: “Hear, O Israel, the LORD is our God, the LORD is one.”"},{"term":"YHWH","def":"The personal name of God in the Hebrew Bible, linked to the verb “to be.”"},{"term":"Systematic theology","def":"Christian doctrine organized into a tidy logical system, which can smooth over tensions the Bible leaves open."}]},{"id":"w-shalom","book":"words","order":10,"num":1,"title":"Shalom","subtitle":"Peace: the word we thought we knew.","hebrew":"שָׁלוֹם","translit":"SHALOM","pron":"sha-LOME","root":"ש-ל-ם","gloss":"Peace","trueMeaning":"Wholeness, completeness, nothing missing or broken","nutshell":"Shalom is usually translated “peace,” but in Hebrew it means wholeness: everything in its right place, nothing lacking, nothing broken. Jesus embodies this shalom by reconciling people to God through self-giving love, not violence. Because shalom cannot be produced by eliminating enemies, followers of Jesus are called to be active peacemakers who help heal the world.","bigIdea":"Shalom is not the absence of conflict but the restoration of wholeness, brought by a Messiah who makes peace through sacrifice, never through the sword.","skeleton":["Shalom means wholeness, not merely “no fighting”","Its root links it to completeness, repayment and perfection","Jesus embodies shalom by bearing wounds to make us whole","A sword-wielding Messiah contradicts the meaning of shalom","Killing enemies never creates real peace","True peace starts with reconciliation and grace","Protection is allowed, but it is not extermination","Shalom reaches self, others, creation and God"],"sections":[{"h":"Deeper than “peace”","p":["*Shalom* may be the best-known Hebrew word in the world. People use it as hello and goodbye, sing it, pray it and print it on banners. Translating it simply as “peace” is like describing the ocean as “wet”: true, but barely scratching the surface.","> Shalom is not just the absence of conflict; it is the presence of wholeness.","It is more than a ceasefire. It means harmony restored everywhere: inside ourselves, between people, with creation and with God. It is mending what was torn, paying what was owed and completing what was missing. It is a picture of the world as it was meant to be."]},{"h":"One root, many rivers","p":["The root of shalom is **shin-lamed-mem** (ש-ל-ם). The same root gives *shalem* (complete, whole), *leshalem* (to pay, to make restitution) and *mushlam* (perfect). To be at shalom is to be whole, with nothing lacking and nothing broken.","So shalom describes a **condition**, not just a feeling: spiritual, social, even financial and physical. That is why it can mean welfare, prosperity, safety, health, harmony and perfection all at once.","In Judges 6:24 Gideon names his altar **YHWH Shalom**, “The LORD is Peace.” God is not only the giver of peace or a peaceful God; he is wholeness itself, the source of all harmony. So greeting someone with “Shalom” really means: “May you be whole. May you be as you were meant to be.”"]},{"h":"When peace becomes a person","p":["In Jesus, shalom takes on flesh. He did not only teach about peace and forgiveness; he became the reconciliation. He stepped into the broken space between God and humanity, not as a warrior but as a suffering servant who carried our wounds to make us whole.","Isaiah 53:5 says the punishment that brought us peace (*shalom*) was on him, and by his wounds we are healed. Jesus is the “Prince of Peace” in more than a poetic sense. He pays the debt (*leshalem*) no one else could, and he forgives, reconciles and completes. In him shalom is a living reality, not an abstract idea."]},{"h":"The false Messiah of the sword","p":["Here the meaning of shalom is often lost, even in Christian theology. Some picture a Messiah who returns as a cosmic general, slaughtering the wicked and ruling by force. This picture usually leans on certain readings of apocalyptic texts in Revelation, such as the “sharp sword” coming from his mouth in Revelation 19:15, taken out of context.","That view makes Jesus contradict himself: the Lamb turns into a lion and abandons his own teaching of nonviolence, as if the Sermon on the Mount were only a gentle pause before the swords come out. It replaces shalom with domination.","Killing enemies may be a victory, but it is a hollow one. Violence can silence voices; it cannot heal hearts. You can conquer a nation, but you cannot reconcile a soul that way."]},{"h":"The myth of peace by elimination","p":["If peace could be won by wiping out whoever threatens it, history would have solved its conflicts long ago. Wars do not end war; they just reshuffle the players and deepen the wounds.","**Fundamentalism**, religious or political, often assumes that removing the “bad people” will make peace bloom. But the line between good and evil does not run between groups; it runs through every human heart.","The Church has fallen into this trap too. From the medieval crusades to Europe's wars of religion, Christians killed millions in the name of the Prince of Peace, and it produced only more division and trauma. A common lament says Christians are “the only army that shoots its own wounded.” That is the opposite of shalom."]},{"h":"Peace begins with reconciliation","p":["Real shalom is not forced on people from outside. It begins inside, when the soul meets grace. Jesus did not come to calm down an angry God. He came to show God's true face: a Father who runs toward prodigal children, forgives seventy times seven and lays down his life for enemies.","> Jesus didn't die to change God's heart about us. He died to change our hearts about God.","The chapter argues that the cross breaks the illusion that God is like pagan gods who need blood to be calmed. While we were still enemies, Christ embraced us, and in that embrace we were made whole. That is shalom: not mere tolerance or a truce, but radical restoration. So we should never imagine the Messiah coming back as a blood-soaked avenger. The Lamb does not change tactics; he remains the Lamb."]},{"h":"Not passivity, but peacemaking","p":["Shalom is not naive **pacifism** (refusing ever to use force). The world is broken and evil is real. Because “love always protects” (1 Corinthians 13:7), force is sometimes needed to protect the innocent, restrain chaos and uphold justice. Police, soldiers and judges have a real role, and Scripture recognizes it.","But protection is not extermination, and justice is not revenge. The shalom Jesus brings is not achieved by domination. It is born through sacrifice, humility and costly love. Jesus absorbed violence without passing it on, and so ended the cycle of revenge by letting it die with him on the cross."]},{"h":"Shalom as a way of life, and for all creation","p":["God's kingdom is not built on the ruins of its enemies but wherever love repairs what hatred broke. Romans 14:17 says the kingdom is about righteousness, peace (*shalom*) and joy in the Holy Spirit. This peace reshapes how we handle conflict, forgive, raise children, speak truth and pray for enemies. It is something we receive and also something we pass on.","Shalom reaches beyond people to the whole of creation. Isaiah 11:6-9 pictures the wolf living with the lamb and the earth full of the knowledge of the LORD. Revelation echoes this with a renewed heaven and earth, tears wiped away and no more death or curse. The story ends not in destruction but in restoration: Eden healed, every fracture mended, every injustice reversed."]},{"h":"Living shalom today","p":["Living in shalom means seeking wholeness in four directions: with **God**, through humility and trust; with **enemies**, through forgiveness, compassion and courage; with **ourselves**, by rejecting shame and accepting grace; and with **creation**, by caring for it rather than just consuming it.","Jesus said, “Blessed are the peacemakers, for they shall be called children of God” (Matthew 5:9). Not peace-wishers, peacekeepers or conflict-avoiders, but makers: builders, restorers, healers. Peacemaking often hurts. It means stepping into conflict with healing instead of weapons, being misunderstood and absorbing insults without hitting back.","In a land loud with war, Jesus said, “Peace I leave with you; my peace I give you. Not as the world gives” (John 14:27). His peace does not depend on circumstances; it is rooted in reconciling love. To know shalom is to know God, because God does not merely want our wholeness, he is our wholeness. The chapter ends by urging readers to let shalom become a rhythm of life, and when the world demands vengeance, to answer: Shalom."]}],"diagrams":[{"type":"wordroot","title":"Anatomy of the word","letters":[{"ch":"ש","name":"Shin","meaning":"sh sound"},{"ch":"ל","name":"Lamed","meaning":"l sound"},{"ch":"ו","name":"Vav","meaning":"o vowel here"},{"ch":"ם","name":"Mem (final form)","meaning":"m sound"}],"root":"ש-ל-ם","rootNote":"to be whole, complete; to pay what is owed","meanings":["peace","wholeness","shalem: complete","leshalem: to repay","mushlam: perfect","welfare, health, safety"]},{"type":"compare","title":"Two ideas of peace","after":4,"left":{"label":"Peace by force","items":["Peace = no fighting","Achieved by removing enemies","Messiah returns as a conquering general","God must be appeased","Silences voices","Ends in destruction"]},"right":{"label":"Hebrew shalom","items":["Peace = wholeness, nothing missing","Achieved through reconciliation and sacrifice","The Lamb remains the Lamb","Our hearts about God are changed","Restores hearts","Ends in restoration: Eden healed"]}},{"type":"tree","title":"Wholeness in every dimension","after":8,"root":"Living shalom","branches":[{"t":"With God","children":["humility","trust"]},{"t":"With enemies","children":["forgiveness","compassion","courage"]},{"t":"With ourselves","children":["rejecting shame","embracing grace"]},{"t":"With creation","children":["caretakers","not just consumers"]}]}],"verses":[{"ref":"Judges 6:24","text":"Gideon built an altar to the LORD there and called it “The LORD is Peace” (YHWH Shalom)."},{"ref":"Isaiah 53:5","text":"He was wounded for our transgressions… the punishment that brought us peace was on him, and by his stripes we are healed."},{"ref":"Matthew 5:9","text":"Blessed are the peacemakers, for they shall be called children of God."},{"ref":"Romans 14:17","text":"The kingdom of God is not eating and drinking, but righteousness, peace and joy in the Holy Spirit."},{"ref":"Isaiah 11:6, 9","text":"The wolf will live with the lamb… the earth will be full of the knowledge of the LORD."},{"ref":"John 14:27","text":"Peace I leave with you; my peace I give you. Not as the world gives do I give to you."}],"keyPoints":["Shalom means wholeness and completeness, not just the absence of conflict.","Its root ש-ל-ם also gives words for “complete,” “to repay” and “perfect.”","Jesus embodies shalom by bearing our wounds and reconciling us, not by conquering.","Peace cannot be achieved by eliminating enemies, because evil runs through every heart.","Using force to protect the innocent is different from extermination or revenge.","Shalom covers our relationships with God, enemies, ourselves and creation.","Followers of Jesus are called to be peacemakers, not just peace-wishers."],"reflect":["Where in your life is something “broken or missing” that shalom would make whole?","Who is an “enemy” you could take a step toward in peacemaking this week?","Does your picture of Jesus' return look more like the Lamb or like a conquering general? Why?"],"quiz":[{"q":"Which word shares the root of shalom and means “to pay or make restitution”?","options":["Shalem","Mushlam","Leshalem","Shema"],"a":2,"why":"Leshalem means to repay; shalem is “complete” and mushlam is “perfect.”"},{"q":"What name did Gideon give his altar in Judges 6:24?","options":["YHWH Shalom","YHWH Yireh","El Shaddai","YHWH Nissi"],"a":0,"why":"YHWH Shalom means “The LORD is Peace”: God as wholeness itself."},{"q":"According to the chapter, why can't peace come from eliminating enemies?","options":["There are too many enemies","The line between good and evil runs through every heart","Weapons are too expensive","God forbids all use of force"],"a":1,"why":"Evil is not confined to one group, so removing “bad people” never produces real peace."},{"q":"How does the chapter view police, soldiers and judges?","options":["As always opposed to shalom","As irrelevant to faith","As having a real role in protecting the innocent","As the main way shalom arrives"],"a":2,"why":"Because love protects, force may restrain evil, but protection is not extermination."}],"terms":[{"term":"Shalom","def":"Hebrew for peace in its full sense: wholeness, completeness, welfare and harmony."},{"term":"Shalem","def":"Complete or whole; from the same root as shalom."},{"term":"Leshalem","def":"To pay or make restitution; to settle what is owed."},{"term":"YHWH Shalom","def":"“The LORD is Peace,” the name Gideon gave his altar."},{"term":"Pacifism","def":"The belief that using force is never acceptable."}]},{"id":"w-nahash","book":"words","order":20,"num":2,"title":"Nahash","subtitle":"The serpent and the Shining One.","hebrew":"נָחָשׁ","translit":"NAHASH","pron":"na-KHASH","root":"נ-ח-ש","gloss":"Serpent","trueMeaning":"Serpent, but also “the shining one”","nutshell":"The “serpent” of Eden, the nahash, comes from a root that means to hiss, to practise divination and to shine, and is linked to the word for gleaming bronze. Ancient Jewish tradition saw it as a radiant, upright being later cursed to crawl. The bronze serpent Moses lifted up, and Jesus lifted on the cross, turn the image of the curse into healing, revealing Jesus as the true Shining One.","bigIdea":"The nahash was a shining rebel who brought death, but Jesus, lifted up like the bronze serpent, is the true Shining One who turns the curse into life.","skeleton":["The talking “snake” is deeper than a cartoon reptile","Nahash's root means hiss, divine and shine","Jewish tradition saw a radiant being, not a lowly snake","The Bible and its world are full of serpent-like divine beings","The curse cast the shining one down into the dust","God used a bronze serpent to heal from serpents","Jesus lifted up is the new bronze serpent and Tree of Life","The cross exposes our sin and reveals God's love"],"sections":[{"h":"More than a talking snake: the meanings of nahash","p":["To modern readers, a snake that talks in Genesis 3 can sound absurd, and sceptics have long mocked the Eden story for it. Children's Bibles show Eve chatting with a reptile curled in a tree. But under that cartoon lies one of the most profound and misunderstood figures in Scripture.","The Hebrew word is *nahash*. The more you dig into it, the more the ground shifts. What if this “serpent” was never meant to be pictured as an ordinary snake at all?","Nahash does mean snake in places, such as Numbers 21. But its three-letter root **nun-chet-shin** (נ-ח-ש) carries three senses: **to hiss** like a snake, **to divine** (practise fortune-telling or occult arts) and **to shine**.","The “shine” sense links it to *nehoshet*, bronze or copper, a polished, gleaming metal. Shining and glowing are often tied to divine or angelic beings in the Bible. So nahash may point to a shining, reptile-like angelic being rather than a plain snake. The International Standard Version even translates Genesis 3:1 as “Now the **Shining One** was more clever than any animal of the field.”","This fits other Scripture. Paul says “Satan himself masquerades as an angel of light” (2 Corinthians 11:14). Revelation speaks of “a great fiery red dragon” (12:3) and “that ancient serpent, called the devil, or Satan” (12:9). So who was Eve really talking to?"]},{"h":"Not a reptile, but a rebel","p":["An ancient Jewish **midrash** (a traditional rabbinic commentary), *Bereshit Rabbah* 20:5, describes the nahash as radiant and upright, perhaps winged, not a creature in the dirt. Some rabbis saw it as an angelic or heavenly being able to speak, which was only later cursed to crawl.","That fits the Bible's world, where heaven and earth overlap. In Eden God walks with humans, and angelic cherubim appear (Genesis 3:24). In such a setting, talking with a heavenly being would not shock Eve. Indeed, she shows no alarm. She likely saw it as one of God's impressive, even beautiful creatures, with no reason yet to distrust it.","The text calls the nahash *arum*, “crafty,” a word that can mean shrewd or discerning and is not automatically evil. The danger was not its shape but its speech. What started as cleverness turned into deception."]},{"h":"Serpents in the divine realm","p":["In Isaiah 6, God is surrounded by **seraphim**, fiery winged beings. The word *saraph* means both “to burn” and “serpent,” and the same word describes the “fiery serpents” in Numbers 21. A seraph may be pictured as a fiery, serpent-like being radiating God's presence: not a garden snake but a creature of flame in God's throne room.","Israel's neighbours also had serpent figures linked with wisdom, immortality and protection. Egypt honoured the **Uraeus** cobra as a sign of divine kingship, and Mesopotamian stories featured shining reptilian beings guarding secrets or tempting humans. Ancient readers of Genesis 3 would therefore have recognized a supernatural being, perhaps a divine guardian gone rogue, rather than a common snake."]},{"h":"The curse and the fall","p":["After deceiving Eve, the nahash is cursed: “You will crawl on your belly and eat dust all the days of your life” (Genesis 3:14). This implies it had not always crawled. The curse takes something away, perhaps legs, wings or both, stripping it of glory. Just as Adam will return to dust, the serpent is confined to it.","The scene echoes Egyptian images of underworld serpents crushed under divine feet, and later prophecies in Isaiah 14 and Ezekiel 28, where proud kings, and the powers behind them, are thrown down from the heights to the grave. The fallen nahash becomes a symbol of rebellion, once exalted and now humiliated, a theme that runs from Eden to Revelation."]},{"h":"A serpent that heals","p":["Surprisingly, the serpent is not always a villain. In Numbers 21 Israel complains against God, and fiery serpents bite the people, and many die. Yet mercy wins: God tells Moses to make a **bronze serpent** and lift it on a pole, and anyone bitten who looks at it lives. In Hebrew that is a *nahash nehoshet*, a wordplay: a gleaming serpent of gleaming metal.","A serpent to save from serpents; death lifted up to bring life. Why not a lamb or a dove? Because healing begins when we face what wounded us. The bronze serpent was like a mirror showing both the result of sin and the promise of healing. The people had to choose to look, just as Eve had to choose. Some surely scoffed; those who looked lived."]},{"h":"Jesus lifted up","p":["Over a thousand years later Jesus used this story for his own mission: “Just as Moses lifted up the serpent in the wilderness, so must the Son of Man be lifted up, that whoever believes in him may have eternal life” (John 3:14-15). He compares himself to the image of the curse (see Galatians 3:13). The one who knew no sin became sin for us (2 Corinthians 5:21).","Jesus becomes the *nahash nehoshet*, the shining one lifted high. We are invited not just to glance but to behold, think, understand and believe. At the cross, all the venom of the human soul is on display: betrayal, cowardice, violence, mockery and torture, ending in the murder of the Messiah. But we also see light. Like the bronze serpent, the cross gleams with a terrible beauty, where death is defeated and shame is healed. God did not abandon us; he became the cure."]},{"h":"From the Tree of Knowledge to the Tree of Life","p":["In Eden, humans reached for a tree to grab what was not theirs: knowledge, control, power. The result was exile, shame and death. On Calvary the Messiah hangs on a tree, not to take but to give, not to punish but to forgive.","The serpent promised, “Your eyes will be opened,” and they were, but only to their own nakedness. Jesus says, in effect, “Look to me and live,” and our eyes open to grace instead of shame. The cross becomes the new **Tree of Life**. The early Church saw the crucifixion as a second Eden: Jesus is the Second Adam, and the cross reverses the first temptation. The serpent deceived by promising life; Jesus redeems by giving it."]},{"h":"The true Shining One","p":["Ironically, the title “shining one” finds its real fulfilment not in the deceiver but in the Redeemer. The enemy still disguises himself as an angel of light, offering glory without sacrifice. Jesus is not a disguise; he is the light itself. Revelation 1 pictures him with eyes like fire, feet like burnished bronze and a face like the sun at full strength, and Hebrews 1:3 calls him “the radiance of God's glory.”","> The serpent sought glory without obedience. Jesus embraced obedience and was glorified.","The serpent corrupted through lies; Jesus restores through truth. The serpent brought death through pride; Jesus brings life through humility."]},{"h":"Looking at the cross today","p":["Golgotha (the hill of the crucifixion) is the peak of humanity's worst: pride, rivalry, **scapegoating** (blaming a victim to keep a group together), violence and the hunger to dominate. Human “order and justice” was unmasked as a power struggle so corrupt it crucified God in the name of truth. Yet it is also where God's love is most clearly revealed: a love that absorbs violence without returning it, forgives while being pierced and conquers by dying rather than killing.","The cross is both a **mirror** and a **window**. As a mirror it shows what we are capable of. As a window it shows what God is like: a God who shines with self-giving love, walks through our venom to heal us and turns the very image of the curse into salvation. Jesus said, “And I, when I am lifted up from the earth, will draw all people to myself” (John 12:32). All who look to him and see the light in the blood will live."]}],"diagrams":[{"type":"wordroot","title":"Anatomy of the word","letters":[{"ch":"נ","name":"Nun","meaning":"n sound"},{"ch":"ח","name":"Chet","meaning":"throaty kh sound"},{"ch":"ש","name":"Shin","meaning":"sh sound"}],"root":"נ-ח-ש","rootNote":"to hiss; to div
