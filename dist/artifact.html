rish = burn forever in hell","Eternal life = endless existence in heaven","Believe = agree he died for your sins","Begins after death","Eternal judgement = punishment without end"]},"right":{"label":"Hebrew / Jewish reading","items":["Perish (apollymi) = lost, wasted, ruined","Eternal life (chayei olam) = God-aligned quality life","Believe = follow the rabbi's way","Begins now","Eternal judgement = complete and final"]}},{"type":"spectrum","title":"Two kinds of life in Jewish thought","after":3,"left":"Chayei sha'ah: fleeting life","right":"Chayei olam: eternal life","points":[{"pos":10,"t":"Survival: work, eat, sleep"},{"pos":45,"t":"Drifting, 'perishing', lost"},{"pos":90,"t":"Knowing God: meaning, blessing, love"}]},{"type":"tree","title":"What 'perish' means: Luke 15","root":"Apollymi: lost, not tormented","branches":[{"t":"Lost sheep","children":["Shepherd searches","Found and carried home"]},{"t":"Lost coin","children":["Woman sweeps the house","Found and celebrated"]},{"t":"Lost son","children":["Wastes his life","Father runs to welcome him"]},{"t":"Israel in exile","children":["'Lost sheep' (Jeremiah 50:6)","Later restored"]}]}],"verses":[{"ref":"John 3:16","text":"For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life."},{"ref":"John 3:17","text":"God did not send his Son into the world to condemn the world, but to save the world through him."},{"ref":"John 17:3","text":"Now this is eternal life: that they know you, the only true God, and Jesus Christ, whom you have sent."},{"ref":"John 5:24","text":"Whoever hears my word and believes him who sent me has eternal life... and has crossed over from death to life."},{"ref":"Matthew 19:17","text":"If you want to enter life, keep the commandments."},{"ref":"Jude 7","text":"Sodom and Gomorrah... serve as an example of those who suffer the punishment of eternal fire."}],"keyPoints":["'Perish' (apollymi) means lost, ruined or wasted, as in the lost sheep, coin and son.","If eternal life meant endless existence, those in endless torment would have it too, so it must mean a kind of life.","John says believers already have eternal life: it begins now.","Chayei olam (eternal life) contrasts with chayei sha'ah (fleeting, survival-only life).","Eternal life is knowing God relationally (John 17:3).","To believe a rabbi was to follow his way; 'whoever believes' means 'whoever follows'.","'Eternal' judgement means complete and final, like Sodom's fire, not endless."],"reflect":["Does your daily life feel more like chayei sha'ah (just surviving) or chayei olam (life with God)? Why?","How does reading 'believe' as 'follow' change what John 3:16 asks of you?","What would it mean for you to 'know God' in the Hebrew sense of closeness rather than information?"],"quiz":[{"q":"What does the Greek word apollymi ('perish') mean?","options":["Tortured forever","Instantly destroyed","Lost, ruined or wasted","Judged in court"],"a":2,"why":"Jesus uses it in Luke 15 for things that are lost and then found."},{"q":"What is chayei olam contrasted with?","options":["Chayei sha'ah, fleeting life","Shalom","Gehenna","Torah"],"a":0,"why":"Chayei sha'ah is survival-only life; chayei olam is God-filled life."},{"q":"How does John 17:3 define eternal life?","options":["Living forever","Going to heaven","Knowing the only true God and Jesus","Keeping the law"],"a":2,"why":"Eternal life is defined by relationship with God."},{"q":"Why does the chapter cite Sodom and Gomorrah's 'eternal fire'?","options":["To show the cities still burn","To describe hell's location","To date Genesis","To show 'eternal' means final and complete"],"a":3,"why":"The fire was decisive and finished, not endless."},{"q":"In a rabbi's world, what did it mean to 'hear and believe' him?","options":["Listen politely","Obey and follow his way","Agree intellectually","Memorise his words"],"a":1,"why":"Believing a rabbi meant entrusting your life to his path."}],"terms":[{"term":"Apollymi","def":"Greek 'to perish': to be lost, ruined or wasted."},{"term":"Chayei olam","def":"Hebrew 'eternal life': a deep, God-rooted quality of life."},{"term":"Chayei sha'ah","def":"Hebrew 'fleeting life': life reduced to mere survival."},{"term":"Anachronism","def":"Reading a later idea back into an earlier time or text."},{"term":"Inherit","def":"In Scripture, to receive one's portion or reward in God's kingdom."}]},{"id":"g-33","book":"gospel","order":330,"part":"Part IV: Understanding Salvation","num":33,"title":"The Gnostic Shadow Behind Today's Gospel","subtitle":"When salvation becomes a knowledge test, Gnosticism is back","nutshell":"This closing chapter of Part IV argues that the modern Western habit of making salvation depend on correct intellectual belief is a repackaged form of Gnosticism, the ancient idea that secret knowledge saves. It traces this to Augustine's Manichaean past, critiques systematic theology's attempt to box God in, and presents biblical faith, modelled by Abraham, as lived trust that shows itself in love.","bigIdea":"Salvation by mastering correct doctrine is a Gnostic distortion; biblical faith is humble, embodied trust in an incomprehensible God, shown in love.","skeleton":["God is infinite, so we should stay humble learners","Systematic theology tries to box the infinite God","Rigid systems breed exclusion and dehumanisation","Faith never required total understanding","Salvation-by-knowledge echoes Gnosticism, via Augustine","Abraham's faith was action, not mental agreement","Saving faith saves people in practical ways; fruit reveals the root","The 'unknown God' is the incomprehensible God"],"sections":[{"h":"The sin of certainty","p":["'In the ages to come he might show the incomparable riches of his grace' (Ephesians 2:7). The West often assumes it has God neatly figured out, the 'sin of certainty.' But if God is boundless and eternal in wisdom, his knowledge is endlessly unfolding, and we should be lifelong students of divine mystery.","You cannot exhaust an infinite source. Made in God's image, we long to grow and discover; that longing is part of our design. So no pastor, professor or preacher in a suit knows everything. Confidence is not omniscience.","This also means paradise won't be boring. It isn't singing the same songs forever but an endless exploration of beauty, love and wisdom. And morally, if we will learn forever, we must stay humble forever, open to the truth others may carry."]},{"h":"Boxing God in: systematic theology","p":["The chapter calls **systematic theology** a well-meant but flawed human attempt to force God into a box, giving the illusion that God has been fully figured out and organised into tidy categories.","It illustrates this with Israel's modern Messianic movement (Jewish believers in Jesus). Founded largely by Westerners and funded by global donations, much of it is strongly Reformed (Calvinist), and systematic theology became central to Reformed thought. Leaders were trained at American institutions and taught that system as final truth, tearing verses from context to fit it. To this day the only systematic theology available to the movement in Hebrew is a Calvinist volume first published in 1986 and only recently translated."]},{"h":"The failed attempt to systematise God","p":["The more polished and rigid the doctrine became, the narrower the movement's tolerance grew. As theology hardened, the ability to live with disagreement collapsed, and boycotts multiplied within a tiny movement. The walls of belief closed in until the path seemed wide enough for one person only.","This led to **dehumanisation**: Jews, Catholics and even fellow Protestants were casually condemned to eternal torment. When theology becomes a weapon of certainty, compassion is the first casualty, and what remains is fear dressed up as conviction. Doctrine mixed with money and power turns anyone who disagrees into an 'other,' idolising a doctrinal statement and assuming salvation depends on precision.","Recovering a vision faithful to the Jewish Scriptures, the Jewish roots of the faith and the Jewish Rabbi Jesus (as in Luke 2:21-41) means dismantling the inherited Western, Augustinian assumptions about God, atonement, salvation and hell. The Gnostic shadow is plain in the assumption that salvation comes through mastering knowledge."]},{"h":"We walk by faith, not by sight","p":["Fundamentalism often sounds overconfident, as if it holds the ultimate truth. Wisdom walks humbly, knowing we see only in part (1 Corinthians 13:12). Faith never required total understanding: Scripture praises belief without sight and hope in what is unseen (Hebrews 11:1; John 20:29; 2 Corinthians 5:7; Romans 8:24-25; 1 Peter 1:8-9).","'If you were blind, you would not be guilty of sin; but now that you claim you can see, your guilt remains' (John 9:41). God shows mercy to the humble and confronts the spiritually proud. Blindness is not the biggest danger; claiming perfect sight is.","Humility lets faith stop feeling threatened by questions. It allows conviction without domination. Imagine if Protestants and Catholics stopped damning each other. One can believe the whole Western framework is distorted and still believe every person inside it is fully loved by God. Truth doesn't need contempt, and love doesn't need uniformity."]},{"h":"'Born again' into modern Gnosticism","p":["Street evangelists often say, 'If you agree, you can be born again right now by repeating this prayer.' But when Jesus spoke of being 'born again' (John 3:3), he had not died, and his death was not expected, so it could not originally mean believing in his death for forgiveness.","The belief that God wants intellectual agreement with the right creed, and that this rescues you from eternal torment, is at heart **Gnosticism**, an ancient heresy that entered Western Christianity in the 4th century. Scholars link this mainly to **Augustine of Hippo**, who spent nearly a decade as a 'hearer' in **Manichaeism**, a dualistic religion widely seen as a major form of Gnosticism. Though he later rejected it, studies of Augustine note that his views on evil, the bound will and inner introspection kept its marks; one scholar describes a 'permanent imprint on his theological imagination.'","Gnostics believed salvation came through *gnosis*, hidden knowledge that enlightened the soul and caused rebirth. Many Western gospel presentations similarly reduce salvation to what you can mentally grasp: believe the right idea, pray the prayer, tick the box."]},{"h":"Test yourself","p":["Suppose someone believes in Christ, prays and is told they are 'saved.' Later they begin to doubt a doctrine like the Trinity, or move to a different denomination. Are they still saved? Many Christians instinctively say no. That answer shows salvation has shifted from what God did in Christ to correct possession of information. That is repackaged Gnosticism.","Theology still matters: what you believe shapes how clearly you see God and represent Christ. But above knowledge, Scripture says **love** matters most (1 Peter 4:8; 1 Corinthians 13:13). True theology produces faith embodied in love that acts, gives and sacrifices. Everyone is a theologian of sorts; some are simply bad ones."]},{"h":"Abraham: faith that does something","p":["In biblical times belief was a living force; Jesus said it could move mountains (Matthew 17:20). 'Abram believed the LORD, and he credited it to him as righteousness' (Genesis 15:6) is often used for 'faith alone' as mental assent, but that rips it from its context.","Abraham's faith was trust shown in action: leaving his land (Genesis 12), building altars, preparing sacrifices (Genesis 15:9-10) and later offering Isaac (Genesis 22). James says his 'faith and his actions were working together, and his faith was made complete by what he did' (James 2:21-22). James is not saying Abraham was saved by works; neither works nor beliefs save us. God alone is the Savior.","Abraham walked roughly 2,500 km (1,500 miles) from Ur (Genesis 11:31) into the unknown, and received a biblical kind of salvation: blessing and protection. His faith was promise-shaped, not fear-driven: trust that God would bless him and make him a blessing to the nations (Genesis 12:2-3). There is no threat of eternal torment anywhere in Genesis or the Hebrew Scriptures; God begins with covenant and love."]},{"h":"Saving faith is lived, not merely believed","p":["If 'faith alone' means my intellectual understanding saves me while others' beliefs damn them, it breeds arrogance: I figured it out, or God uniquely chose me. Salvation becomes a badge of superiority, and its weight shifts from God to my mental performance.","But 'saving faith' never had to do with escaping torment. It is faith that **actually saves**: it feeds the hungry, shelters the homeless on cold nights, steps out of the boat into the storm, loves enemies and stands with the oppressed. That is the faith Jesus lived, not a Greek philosopher's theory but a Jewish rabbi's teaching in truth and action.","Every faith bears fruit; the question is what kind. The fruit of the Spirit is love, joy, peace, patience, kindness, gentleness, humility and compassion. Rotten fruit, arrogance, harshness, cruelty and exclusion, shows something is wrong with the faith itself, whatever degrees or eloquence lie behind it, in individuals and whole movements alike.","> Faith that saves will always look like love in motion."]},{"h":"Jesus' saving faith and the incomprehensible God","p":["Jesus never went around asking, 'If you died tonight, would you go to heaven or hell?' He healed lepers, fed the hungry, blessed the poor and announced that God's kingdom was near. For him, faith and salvation were God's reign breaking into real life: the broken restored, the lost found, the dead rising.","At Athens Paul pointed to the altar 'to an unknown god' (Acts 17:23). The chapter says *Agnostos Theos* is better understood as the **incomprehensible God**, beyond human understanding, which is why Paul chose it. Trying to define every aspect of God 'systematically' places humans above him and creates a god in our image.","Biblical theology is valuable; it is what this whole book does. But when intellect or 'special enlightenment' becomes the key to salvation, we drift into Gnosticism and shrink a world-changing message into an exam about avoiding torment."]},{"h":"Conclusion: a garden, not a fortress","p":["Let go of the burden of needing to 'be right' and step into the freedom of being loved. Trade the urge to win debates for a desire to love well. Your faith is not a fortress to defend but a **garden to tend**, growing through everyday kindness and justice.","Faith is not about mastering God in seminary but about being mastered by love. God is not threatened by our questions or confined by our systems. He invites us into an endless journey of trust, humility and discovery, and our hope rests not on our knowledge but on a God who is endlessly patient, gracious and faithful."]}],"diagrams":[{"type":"compare","title":"Gnostic salvation vs. biblical faith","after":4,"left":{"label":"Gnosticism (ancient and modern)","items":["Saved by secret or correct knowledge","Rebirth by mental enlightenment or a prayer","Doubting a doctrine endangers salvation","Breeds pride and exclusion","Faith as a fortress to defend"]},"right":{"label":"Biblical faith","items":["Saved by God alone, the Savior of the world","Rebirth into a new way of life","Trust without full understanding","Bears fruit of love and humility","Faith as a garden to tend"]}},{"type":"flow","title":"How the Gnostic shadow entered the Western gospel","after":4,"steps":[{"t":"Gnosticism","d":"Ancient movements teach salvation through secret knowledge (gnosis)."},{"t":"Manichaeism","d":"Augustine spends nearly a decade as a hearer in this dualistic religion."},{"t":"Augustine's theology","d":"His views on evil, the will and inner life keep its imprint."},{"t":"Western systems","d":"Salvation is tied to correct belief and personal inner experience."},{"t":"Modern gospel","d":"Believe the right idea, pray the prayer, tick the box."}]},{"type":"tree","title":"Abraham's embodied faith","root":"Abram believed the LORD (Genesis 15:6)","branches":[{"t":"He moved","children":["Left Ur and his land (Genesis 11:31; 12)","About 2,500 km into the unknown"]},{"t":"He worshipped","children":["Built altars","Prepared sacrifices (Genesis 15:9-10)"]},{"t":"He trusted","children":["Offered Isaac (Genesis 22)","Faith completed by action (James 2:22)"]},{"t":"He was blessed","children":["Protection and blessing","A blessing to the nations (Genesis 12:2-3)"]}]}],"verses":[{"ref":"Ephesians 2:7","text":"In the coming ages he might show the incomparable riches of his grace."},{"ref":"1 Corinthians 13:12","text":"For now we see only a reflection as in a mirror... now I know in part."},{"ref":"John 9:41","text":"If you were blind, you would not be guilty of sin; but now that you claim you can see, your guilt remains."},{"ref":"Genesis 15:6","text":"Abram believed the LORD, and he credited it to him as righteousness."},{"ref":"James 2:22","text":"His faith and his actions were working together, and his faith was made complete by what he did."},{"ref":"Acts 17:23","text":"I found an altar with this inscription: TO AN UNKNOWN GOD."}],"keyPoints":["Because God is infinite, humans should remain humble, lifelong learners.","Systematic theology tries to box God in, and rigid systems breed exclusion and dehumanisation.","Faith never required full understanding; claiming perfect sight is the real danger (John 9:41).","Making salvation depend on correct knowledge is a modern form of Gnosticism, linked to Augustine's Manichaean past.","Abraham's faith was trust shown through costly action, not mere mental agreement.","Saving faith saves people practically, and its fruit is love.","Agnostos Theos is the incomprehensible God, who cannot be mastered by our systems."],"reflect":["Would you still consider someone 'saved' if they changed their view on a major doctrine? What does your answer reveal?","What fruit does your faith tend to produce: more love and humility, or more certainty and judgement?","What would it look like to treat your faith as a garden rather than a fortress?"],"quiz":[{"q":"What did ancient Gnostics believe brought salvation?","options":["Good works","Animal sacrifice","Gnosis, special hidden knowledge","Pilgrimage"],"a":2,"why":"Gnostics taught that secret knowledge enlightened and freed the soul."},{"q":"Which religion did Augustine follow for nearly a decade?","options":["Manichaeism","Stoicism","Judaism","Mithraism"],"a":0,"why":"Manichaeism, a dualistic Gnostic-type religion, left its imprint on his thought."},{"q":"What point does James 2:21-22 make about Abraham?","options":["He was saved by works","He doubted God","His faith was completed by action","He had no faith"],"a":2,"why":"Faith and actions worked together; biblical faith is lived."},{"q":"How does the chapter interpret Agnostos Theos (Acts 17:23)?","options":["The false god","The Greek god Zeus","The god of agnostics","The incomprehensible God"],"a":3,"why":"It is God beyond human understanding, who cannot be boxed in."},{"q":"According to the chapter, why couldn't 'born again' in John 3:3 originally mean believing in Jesus' death for sins?","options":["John 3 was written later","Jesus had not yet died and his death wasn't expected","Nicodemus was Greek","The phrase isn't in John"],"a":1,"why":"Reading it that way puts a later idea into the earlier conversation."}],"terms":[{"term":"Gnosticism","def":"Ancient movements teaching that salvation comes through secret spiritual knowledge."},{"term":"Manichaeism","def":"A late-ancient dualistic religion of light versus darkness, often seen as Gnostic."},{"term":"Systematic theology","def":"Organising all beliefs about God into one complete, logical system."},{"term":"Agnostos Theos","def":"Greek 'unknown God'; read here as the God beyond human comprehension."},{"term":"Fruit of the Spirit","def":"The qualities, such as love, joy and kindness, that genuine faith produces."}]}],"glossary":[{"term":"Yeshua","def":"Jesus' original Hebrew name, meaning “salvation” or “the LORD saves.” Using it highlights that He was Jewish and that His mission belongs inside Israel's story."},{"term":"Eternal","def":"In modern English, “eternal” means endless, a meaning drawn from Greek philosophy. In the Bible (Hebrew olam, Greek aion/aionios) it usually means an age or era, or describes the quality, fullness or kind of something, especially something that belongs to God's realm, rather than infinite length. Some translations use “age” to show this."},{"term":"Eternal Life","def":"An ancient Jewish expression contrasted with “fleeting life,” a life wrapped up in temporary, material things. It is mainly about the quality and depth of life lived in line with God's will, not just living forever. Jesus defines it by relationship: “This is eternal life: that they know You” (John 17:3)."},{"term":"Life","def":"In modern English, simply being biologically alive. In the Bible, life usually means a rich, full existence of blessing, wellbeing, flourishing and God's favour (John 10:10). To “choose life” (Deuteronomy 30:19) means living in step with God's covenant purposes."},{"term":"Gnosticism","def":"An ancient movement teaching that salvation, especially escape after death, comes through secret spiritual knowledge (Greek gnosis). It saw the physical world as evil and taught that people must be reborn through spiritual or intellectual enlightenment to escape judgment."},{"term":"Dualism","def":"The philosophical idea that reality is made of two opposed principles, usually mind or spirit (good) versus body or matter (evil)."},{"term":"Manichaeism","def":"A form of Gnostic dualism teaching an endless cosmic war between Light (good) and Darkness (evil). Human souls were seen as sparks of divine light trapped in corrupt bodies, freed through special knowledge and strict self-denial."},{"term":"Augustine of Hippo","def":"An influential 4th–5th-century theologian, honoured especially in Catholic and Calvinist traditions. Earlier involvement with Manichaeism, Gnostic ideas and dualism shaped his theology, which deeply influenced Western teaching on salvation, sin, grace, judgment, predestination, infant baptism and hellfire."},{"term":"Eternal Conscious Torment","def":"The Augustinian-Calvinist view that hell is a literal place where body and soul suffer consciously and without end, often called the “hellfire” doctrine. It is dominant in Western Christianity, especially in conservative Protestant and Catholic circles."},{"term":"Tikkun Olam","def":"Hebrew for “repair of the world,” first found in the 2nd-century Mishnah (Gittin 4). It expresses the Jewish hope that the world will be healed and renewed, not escaped, matching the biblical hope for the “restoration of all things” (Acts 3:21) and the prophets' promise of renewal (Isaiah 35:1-6)."}]};
</script>
<script>
(() => {
const D = window.APP_DATA || { books: [], chapters: [], glossary: [] };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem('hl:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hl:' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const plain = s => String(s ?? '').replace(/\*+/g, '');
const byId = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const bookOf = id => D.books.find(b => b.id === id);
const chaptersOf = bk => D.chapters.filter(c => c.book === bk);
const ARROW = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';

/* ---------- settings ---------- */
const SCHEMES = [
  ['tekhelet', 'Tekhelet', 255, 78], ['olive', 'Olive', 128, 70], ['pomegranate', 'Pomegranate', 12, 82], ['galilee', 'Galilee', 205, 35],
  ['sand', 'Desert', 55, 25], ['purple', 'Royal', 300, 85], ['cedar', 'Cedar', 160, 50]
];
const root = document.documentElement;
function applySettings() {
  const s = store.get('settings', { scheme: 'tekhelet', mode: 'auto', size: 1, motion: 'on' });
  if (s.scheme === 'tekhelet') delete root.dataset.scheme; else root.dataset.scheme = s.scheme;
  if (s.mode === 'auto') delete root.dataset.theme; else root.dataset.theme = s.mode;
  root.style.setProperty('--fs', s.size);
  root.classList.toggle('calm', s.motion === 'calm');
  $$('#swatches .sw').forEach(b => b.setAttribute('aria-pressed', b.dataset.scheme === s.scheme));
  $$('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === s.mode));
  $$('#sizeSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.size === +s.size));
  $$('#motionSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.motion === s.motion));
  return s;
}
function setSetting(k, v) { const s = store.get('settings', { scheme: 'tekhelet', mode: 'auto', size: 1, motion: 'on' }); s[k] = v; store.set('settings', s); applySettings(); }
$('#swatches').innerHTML = SCHEMES.map(([id, name, h, h2]) =>
  `<button class="sw" data-scheme="${id}" aria-label="${name} colour scheme"><i style="background:oklch(52% .14 ${h});--g:oklch(78% .13 ${h2})"></i><span>${name}</span></button>`).join('');
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) setSetting('scheme', b.dataset.scheme); });
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('mode', b.dataset.mode); });
$('#sizeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('size', +b.dataset.size); });
$('#motionSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSetting('motion', b.dataset.motion); });
const panel = $('#panel'), themeBtn = $('#themeBtn');
themeBtn.addEventListener('click', e => { e.stopPropagation(); panel.hidden = !panel.hidden; themeBtn.setAttribute('aria-expanded', !panel.hidden); });
document.addEventListener('click', e => { if (!panel.hidden && !panel.contains(e.target)) { panel.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); } });
applySettings();

/* ---------- progress ---------- */
const done = new Set(store.get('done', []));
const toggleDone = id => { done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); };

/* ---------- toast ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }

/* ---------- diagram renderers ---------- */
const R = {
  flow: d => `<div class="flow">${d.steps.map((s, i) => `<div class="step" style="--i:${i}"><div class="node"><span class="si">STEP ${i + 1}</span><b>${md(s.t)}</b>${s.d ? `<p>${md(s.d)}</p>` : ''}</div><div class="arr">${ARROW}</div></div>`).join('')}</div>`,

  cycle: d => {

function wireDiagrams(scope) {
  $$('.cycle-wrap', scope).forEach(w => {
    const sel = i => { $$('.cn', w).forEach(g => g.setAttribute('aria-pressed', g.dataset.i == i)); $$('.cycle-list li', w).forEach(li => li.classList.toggle('on', li.dataset.i == i)); };
    w.addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) sel(t.dataset.i); });
    w.addEventListener('keydown', e => { const t = e.target.closest('.cn'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sel(t.dataset.i); } });
    let k = 0; const n = $$('.cn', w).length;
    const timer = setInterval(() => { if (!document.body.contains(w)) return clearInterval(timer); if (w.matches(':hover')) return; k = (k + 1) % n; sel(k); }, 3200);
  });
  $$('[data-replay]', scope).forEach(b => b.addEventListener('click', () => { const f = b.closest('.dia'); f.classList.remove('play'); void f.offsetWidth; f.classList.add('play'); }));
  $$('[data-lens]', scope).forEach(b => b.addEventListener('click', () => { const f = b.closest('.dia'); const on = f.classList.toggle('lens-toggle'); b.textContent = on ? 'Show both lenses' : 'Focus Hebrew lens'; }));

  if ('IntersectionObserver' in window) {

    $$('[data-anim]', scope).forEach(el => { const r = el.getBoundingClientRect(); if (r.top > innerHeight) io.observe(el); });
  }
}

      o.classList.add(ok ? 'right' : 'wrong'); if (!ok) $$('.opt', q)[q.dataset.a].classList.add('right');
      $$('.opt', q).forEach(b => b.disabled = true); $('.why', q).hidden = false;
      if (answered === total) $('.score', qz).textContent = `You scored ${right} of ${total}. ${right === total ? 'Excellent!' : right >= total / 2 ? 'Good work. Review the explanations above.' : 'Try reading the chapter again, then retry.'}`;
    });
  });
}

function viewWords() {
  setNav('words');
  const ws = chaptersOf('words').filter(c => c.hebrew); let k = 0;
  main.innerHTML = `<div class="view"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Flashcards</div><h2>The 15 Hebrew words</h2><p>Tap the card to flip it. Use the arrow keys on a keyboard.</p></div></div>
  <div class="fc-stage"><button class="fc" id="fc" aria-label="Flip card"><div class="face front"></div><div class="face back"></div></button>
  <div class="fc-controls"><button class="btn small" id="fcPrev">← Previous</button><button class="btn small" id="fcShuffle">Shuffle</button><button class="btn small primary" id="fcFlip">Flip</button><button class="btn small" id="fcNext">Next →</button></div>
  <div class="fc-dots" id="fcDots"></div></div></div>`;
  const fc = $('#fc');
  const draw = () => {
    const c = ws[k]; if (!c) return; fc.classList.remove('flipped');
    $('.front', fc).innerHTML = `<small>WORD ${c.num} OF 15</small><span class="he">${esc(c.hebrew)}</span><b>${esc(c.translit)}</b><small>Usually: ${esc(c.gloss)}</small>`;
    $('.back', fc).innerHTML = `<small>${esc(c.translit)} really means</small><h3>${esc(c.trueMeaning)}</h3><p>${md(c.nutshell)}</p><small><a href="#c-${c.id}" onclick="event.stopPropagation()">Read the full topic →</a></small>`;
    $('#fcDots').innerHTML = ws.map((_, i) => `<button aria-label="Card ${i + 1}" aria-current="${i === k}" data-i="${i}"></button>`).join('');
  };
  fc.addEventListener('click', () => fc.classList.toggle('flipped'));
  $('#fcFlip').onclick = () => fc.classList.toggle('flipped');
  $('#fcNext').onclick = () => { k = (k + 1) % ws.length; draw(); };
  $('#fcPrev').onclick = () => { k = (k - 1 + ws.length) % ws.length; draw(); };
  $('#fcShuffle').onclick = () => { for (let i = ws.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ws[i], ws[j]] = [ws[j], ws[i]]; } k = 0; draw(); toast('Shuffled'); };
  $('#fcDots').onclick = e => { const b = e.target.closest('button'); if (b) { k = +b.dataset.i; draw(); } };
  keyHandler = e => { if (e.key === 'ArrowRight') $('#fcNext').click(); if (e.key === 'ArrowLeft') $('#fcPrev').click(); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); fc.classList.toggle('flipped'); } };
  draw();
}
let keyHandler = null;
document.addEventListener('keydown', e => keyHandler && keyHandler(e));

function viewMap() {
  setNav('map');
  const ws = chaptersOf('words').filter(c => c.hebrew), g = chaptersOf('gospel'), gb = bookOf('gospel');
  const parts = [...new Set(g.map(c => c.part))];
  // constellation positions on a gentle spiral
  const pos = ws.map((_, i) => { const a = i * 2.4, r = 14 + i * 2.4; return [50 + r * Math.cos(a) * 1.15, 50 + r * Math.sin(a) * .95]; });
  main.innerHTML = `<div class="view">
  <div class="section-head" style="margin-top:0"><div><div class="eyebrow">Big-picture map</div><h2>How it all fits together</h2><p>Journey 1 is a constellation of 15 words that each restore a lost meaning. Journey 2 is one long argument, read top to bottom like a flowchart. Tap any node to open it.</p></div></div>
  <div class="dia" style="margin-bottom:30px"><div class="dia-head"><span class="tag">Constellation</span><h3>The 15 words</h3></div>
    <div class="constellation"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${pos.slice(1).map((p, i) => `<line x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg>
    ${ws.map((c, i) => `<a href="#c-${c.id}" style="left:${pos[i][0]}%;top:${pos[i][1]}%;--i:${i}"><span class="he">${esc(c.hebrew)}</span><span>${esc(c.translit)}</span></a>`).join('')}</div></div>
  <div class="dia"><div class="dia-head"><span class="tag">Flowchart</span><h3>${esc(gb?.title || '')}: the argument in ${parts.length} parts</h3></div>
  <div class="map">${parts.map((p, pi) => `${pi ? `<div class="map-arrow"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg></div>` : ''}
    <div class="map-part"><div class="mp-label"><small>${partMeta(gb, p).num === '0' ? 'START' : 'PART ' + esc(partMeta(gb, p).num)}</small><b>${esc(p)}</b></div><div class="map-nodes">${g.filter(c => c.part === p).map((c, k, arr) => `<a href="#c-${c.id}">${esc(c.title)}</a>${k < arr.length - 1 ? '<span class="to">→</span>' : ''}`).join('')}</div></div>`).join('')}</div>
  ${gb?.thesis ? `<p class="dia-note">${md(gb.thesis)}</p>` : ''}</div></div>`;
}

function viewGlossary() {
  setNav('glossary');
  const terms = [...D.glossary.map(t => ({ ...t })), ...D.chapters.flatMap(c => (c.terms || []).map(t => ({ ...t, from: c.id })))];
  const seen = new Map(); terms.forEach(t => { const k = t.term.toLowerCase(); if (!seen.has(k)) seen.set(k, t); });
  const all = [...seen.values()].sort((a, b) => a.term.localeCompare(b.term));
  const letters = [...new Set(all.map(t => t.term[0].toUpperCase()))];
  main.innerHTML = `<div class="view"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Glossary</div><h2>${all.length} key terms, in plain words</h2></div>
    <div class="search" style="width:min(320px,100%)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr" for="gq">Filter terms</label><input id="gq" type="search" placeholder="Filter terms…"></div></div>
    <div class="gloss-filter">${letters.map(l => `<button class="chip" data-l="${l}">${l}</button>`).join('')}</div>
    <div class="gloss" id="gl"></div></div>`;
  const draw = (f = '') => { const q = f.toLowerCase(); $('#gl').innerHTML = all.filter(t => !q || t.term.toLowerCase().includes(q) || t.def.toLowerCase().includes(q)).map(t => `<div class="term"><b>${esc(t.term)}</b><p>${md(t.def)}</p>${t.from && byId[t.from] ? `<a href="#c-${t.from}">From: ${esc(byId[t.from].translit && byId[t.from].hebrew ? byId[t.from].translit : byId[t.from].title)} →</a>` : ''}</div>`).join('') || '<p>No terms match that filter.</p>'; };
  $('#gq').addEventListener('input', e => draw(e.target.value));
  $('.gloss-filter').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; const el = $$('#gl .term b').find(x => x.textContent.toUpperCase().startsWith(b.dataset.l)); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  draw();
}

function viewQuiz() {
  setNav('quiz');
  const pool = D.chapters.flatMap(c => (c.quiz || []).map(q => ({ ...q, src: c.id })));
  const pick = pool.sort(() => Math.random() - .5).slice(0, 10);
  main.innerHTML = `<div class="view" style="max-width:760px"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Mixed quiz</div><h2>Ten questions from across both journeys</h2><p>${pool.length} questions in the pool. Each round draws a new set.</p></div><button class="btn small primary" id="again">New round</button></div>${quizHTML(pick)}</div>`;
  wireQuiz(main); $('#again').onclick = () => viewQuiz();
}

function viewInstall() {
  setNav(null);
  const href = location.href.split('#')[0];
  main.innerHTML = `<div class="view" style="max-width:900px"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">Use it everywhere</div><h2>Download &amp; install</h2><p>The whole app is one self-contained file. Open it from the link below on any phone, tablet or computer, or save it and open it offline.</p></div></div>
  <div class="term" style="margin-bottom:14px"><b>Link to this app</b><div class="copy-row"><code id="link">${esc(href)}</code><button class="btn small primary" id="copy">Copy link</button></div></div>
  <div class="install">
   <div class="term"><b>iPhone &amp; iPad</b><ol><li>Open the link in Safari.</li><li>Tap the Share button.</li><li>Choose <b>Add to Home Screen</b>.</li></ol></div>
   <div class="term"><b>Android</b><ol><li>Open the link in Chrome.</li><li>Tap the ⋮ menu.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol></div>
   <div class="term"><b>Windows, Mac, Linux</b><ol><li>Open the link in Chrome or Edge.</li><li>Click the install icon in the address bar.</li><li>Or download the single <b>index.html</b> file and double-click it to read offline.</li></ol></div>
  </div></div>`;
  $('#copy').onclick = () => { const t = $('#link').textContent; navigator.clipboard?.writeText(t).then(() => toast('Link copied'), () => { getSelection().selectAllChildren($('#link')); toast('Press Ctrl+C or ⌘C to copy'); }) ?? (getSelection().selectAllChildren($('#link'))); };
}

/* ---------- router ---------- */
let first = true;
function render() {
  keyHandler = null;
  try { window.speechSynthesis?.cancel(); } catch {}
  const h = location.hash.slice(1) || 'home';
  const go = () => {
    if (h.startsWith('c-')) viewChapter(h.slice(2));
    else if (h === 'words') viewWords();
    else if (h === 'map') viewMap();
    else if (h === 'glossary') viewGlossary();
    else if (h === 'quiz') viewQuiz();
    else if (h === 'install') viewInstall();
    else viewHome();
    wireDrawer();
  };
  if (first) { first = false; go(); return; }
  main.innerHTML = skeleton(h.startsWith('c-') ? 'chapter' : 'grid');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  setTimeout(go, 380);
}
function wireDrawer() {
  const toc = $('#toc'); const btn = $('#menuBtn');
  btn.style.visibility = toc ? 'visible' : 'hidden';
  btn.onclick = () => { if (!toc) return; toc.classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.onclick = close; document.body.append(s); };
  function close() { toc?.classList.remove('open'); $('.scrim')?.remove(); }
  toc?.addEventListener('click', e => { if (e.target.closest('a')) close(); });
}
window.addEventListener('hashchange', () => { $('.scrim')?.remove(); render(); });

/* reading progress bar */
addEventListener('scroll', () => { const el = document.documentElement; const p = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight); $('#readProgress').style.width = (location.hash.startsWith('#c-') ? p * 100 : 0) + '%'; }, { passive: true });

/* search */
const idx = D.chapters.map(c => ({ c, text: [c.title, c.subtitle, c.translit, c.hebrew, c.gloss, c.trueMeaning, c.nutshell, ...(c.keyPoints || []), ...c.sections.flatMap(s => [s.h, ...s.p])].map(plain).join(' ') }));
const q = $('#q'), res = $('#results');
q.addEventListener('input', () => {
  const v = q.value.trim().toLowerCase(); if (v.length < 2) { res.hidden = true; return; }
  const hits = idx.filter(x => x.text.toLowerCase().includes(v)).slice(0, 12);
  res.innerHTML = hits.length ? hits.map(({ c, text }) => { const at = text.toLowerCase().indexOf(v); const snip = text.slice(Math.max(0, at - 50), at + 90); return `<a href="#c-${c.id}"><b>${esc(c.hebrew ? c.translit + ' · ' + c.title : c.title)}</b><span>…${esc(snip).replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`)}…</span></a>`; }).join('') : '<div style="padding:12px;color:var(--muted)">No topics match. Try another word.</div>';
  res.hidden = false;
});
res.addEventListener('click', e => { if (e.target.closest('a')) { res.hidden = true; q.value = ''; } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });

/* offline install when served over https (GitHub Pages); harmless elsewhere */
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}

render();
})();
</script>
